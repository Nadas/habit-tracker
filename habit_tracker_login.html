<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habit Tracker - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f1ed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    .container { width: 100%; max-width: 320px; padding: 20px; }
    .card {
      background: #141411;
      border: 1px solid #2a2925;
      border-radius: 8px;
      padding: 32px 24px;
    }
    .header { text-align: center; margin-bottom: 28px; }
    .app-name { font-size: 18px; font-weight: 400; margin-bottom: 4px; letter-spacing: 0.5px; }
    .tagline { font-size: 11px; color: #8a8985; font-weight: 400; }
    .form-section { margin-bottom: 16px; }
    label {
      display: block;
      color: #8a8985;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      font-family: inherit;
      background: #0a0a0a;
      border: 1px solid #2a2925;
      color: #f5f1ed;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #d97757; }
    input::placeholder { color: #7a7570; }
    .login-button {
      width: 100%;
      padding: 10px;
      background: #d97757;
      border: none;
      border-radius: 4px;
      color: #0a0a0a;
      font-weight: 600;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-button:hover { opacity: 0.9; }
    .login-button:disabled { opacity: 0.6; cursor: default; }
    .error {
      background: rgba(217, 119, 87, 0.1);
      border: 1px solid rgba(217, 119, 87, 0.3);
      color: #d97757;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .spinner {
      display: none;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(10,10,10,0.4);
      border-top-color: #0a0a0a;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .spinner.visible { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="app-name">Discipline</div>
        <div class="tagline">Track your daily habits</div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="error" id="errorMessage"></div>

        <div class="form-section">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-section">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-button" id="loginButton">
          <span id="buttonText">Sign In</span>
          <span class="spinner" id="loadingSpinner"></span>
        </button>

        <button type="button" class="login-button" id="signupButton" onclick="handleSignup()"
          style="background:#2a2925;color:#8a8985;margin-top:8px;">
          <span id="signupText">Create Account</span>
          <span class="spinner" id="signupSpinner"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already logged in, go straight to the tracker
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'habit_tracker_mockup.html';
    });

    async function handleLogin(event) {
      event.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('errorMessage');
      const btn      = document.getElementById('loginButton');
      const btnText  = document.getElementById('buttonText');
      const spinner  = document.getElementById('loadingSpinner');

      errorEl.classList.remove('visible');
      btnText.textContent = '';
      spinner.classList.add('visible');
      btn.disabled = true;

      const { error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add('visible');
        btnText.textContent = 'Sign In';
        spinner.classList.remove('visible');
        btn.disabled = false;
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      } else {
        window.location.href = 'habit_tracker_mockup.html';
      }
    }

    async function handleSignup() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('errorMessage');
      const btn      = document.getElementById('signupButton');
      const btnText  = document.getElementById('signupText');
      const spinner  = document.getElementById('signupSpinner');

      if (!email || !password) {
        errorEl.textContent = 'Please enter your email and password first.';
        errorEl.classList.add('visible');
        return;
      }

      errorEl.classList.remove('visible');
      btnText.textContent = '';
      spinner.classList.add('visible');
      btn.disabled = true;

      const { error } = await db.auth.signUp({ email, password });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add('visible');
        btnText.textContent = 'Create Account';
        spinner.classList.remove('visible');
        btn.disabled = false;
      } else {
        // Account created — now sign in
        const { error: loginError } = await db.auth.signInWithPassword({ email, password });
        if (loginError) {
          errorEl.textContent = 'Account created! Try signing in now.';
          errorEl.classList.add('visible');
          btnText.textContent = 'Create Account';
          spinner.classList.remove('visible');
          btn.disabled = false;
        } else {
          window.location.href = 'habit_tracker_mockup.html';
        }
      }
    }
  </script>
</body>
</html>
