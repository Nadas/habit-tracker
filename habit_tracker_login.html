<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f1ed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 320px;
      padding: 20px;
    }
    .card {
      background: #141411;
      border: 1px solid #2a2925;
      border-radius: 8px;
      padding: 32px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .app-name {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-size: 11px;
      color: #8a8985;
      font-weight: 400;
    }
    .form-section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      color: #8a8985;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      font-family: inherit;
      background: #0a0a0a;
      border: 1px solid #2a2925;
      color: #f5f1ed;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #d97757;
    }
    input::placeholder {
      color: #7a7570;
    }
    .login-button {
      width: 100%;
      padding: 10px;
      background: #d97757;
      border: none;
      border-radius: 4px;
      color: #0a0a0a;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .login-button:hover {
      opacity: 0.9;
    }
    .login-button:active {
      opacity: 0.8;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: #2a2925;
    }
    .divider-text {
      font-size: 10px;
      color: #7a7570;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .demo-button {
      width: 100%;
      padding: 10px;
      background: #141411;
      border: 1px solid #2a2925;
      border-radius: 4px;
      color: #8a8985;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-button:hover {
      border-color: #d97757;
      color: #f5f1ed;
    }
    .error {
      background: rgba(217, 119, 87, 0.1);
      border: 1px solid rgba(217, 119, 87, 0.3);
      color: #d97757;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible {
      display: block;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 16px 0;
    }
    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #d97757;
    }
    .remember-me label {
      margin: 0;
      font-size: 11px;
      text-transform: none;
      font-weight: 400;
      color: #8a8985;
      cursor: pointer;
    }
    .loading {
      display: none;
    }
    .loading.visible {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #d97757;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="app-name">Discipline</div>
        <div class="tagline">Track your daily habits</div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="error" id="errorMessage"></div>

        <div class="form-section">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            placeholder="Enter username" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-section">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="login-button">
          <span id="buttonText">Sign In</span>
          <span class="loading" id="loadingSpinner"></span>
        </button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">Or try demo</div>
        <div class="divider-line"></div>
      </div>

      <button class="demo-button" onclick="handleDemo()">
        Demo Mode (No Login)
      </button>
    </div>
  </div>

  <script>
    // Demo credentials for testing
    const validCredentials = {
      'nada': 'password123',
      'demo': 'demo'
    };

    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorMessage = document.getElementById('errorMessage');
      const buttonText = document.getElementById('buttonText');
      const loadingSpinner = document.getElementById('loadingSpinner');

      // Clear previous error
      errorMessage.classList.remove('visible');
      errorMessage.textContent = '';

      // Show loading state
      buttonText.textContent = '';
      loadingSpinner.classList.add('visible');
      document.querySelector('.login-button').disabled = true;

      // Simulate API delay
      setTimeout(() => {
        // Validate credentials
        if (validCredentials[username] && validCredentials[username] === password) {
          // Success - store session
          if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
            localStorage.setItem('username', username);
          } else {
            localStorage.removeItem('rememberMe');
            localStorage.removeItem('username');
          }
          
          // Redirect to main tracker
          console.log('Login successful:', username);
          setTimeout(() => {
            window.location.href = 'habit_tracker_mockup.html';
          }, 300);
        } else {
          // Error
          errorMessage.textContent = 'Invalid username or password';
          errorMessage.classList.add('visible');
          
          // Reset button
          buttonText.textContent = 'Sign In';
          loadingSpinner.classList.remove('visible');
          document.querySelector('.login-button').disabled = false;
          
          // Clear password field
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 800);
    }

    function handleDemo() {
      console.log('Demo mode activated');
      // Go directly to main tracker without login
      window.location.href = 'habit_tracker_mockup.html';
    }

    // Check if user was remembered
    document.addEventListener('DOMContentLoaded', function() {
      const rememberMe = localStorage.getItem('rememberMe');
      const username = localStorage.getItem('username');
      
      if (rememberMe === 'true' && username) {
        document.getElementById('username').value = username;
        document.getElementById('rememberMe').checked = true;
        document.getElementById('password').focus();
      }
    });

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.querySelector('form').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
