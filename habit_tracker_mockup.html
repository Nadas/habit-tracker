<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    button { outline: none; }
    button:focus-visible {
      outline: 1px solid #d97757;
      outline-offset: 1px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f1ed;
      touch-action: manipulation;
    }
    .container { min-height: 100vh; background: #0a0a0a; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#7a7570;font-size:12px;">Loading…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    function dateKey(date) {
      // Build the key from local date parts (not toISOString/UTC) so the
      // key always matches the calendar day the user actually sees,
      // regardless of timezone offset.
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Appointments don't need a separate Morning/Evening picker — the
    // time field already implies it. Before noon -> morning, otherwise
    // evening. No time given -> defaults to evening.
    function deriveSection(timeStr) {
      if (!timeStr) return 'evening';
      const hour = parseInt(timeStr.split(':')[0], 10);
      return (!isNaN(hour) && hour < 12) ? 'morning' : 'evening';
    }

    const PRAYER_KEYS    = ['fajr','dhuhr','asr','maghrib','isha'];
    const PRAYER_DEFAULT = { fajr:false, dhuhr:false, asr:false, maghrib:false, isha:false, menstruating:false };

    let state = {
      activeTab: 'daily',
      selectedDate: new Date(),
      habits: [],
      completionsByDate: {},
      prayersByDate: {},
      dailyNotes: {},
      prayerHabitId: null,
      calendarOpen: false,
      calendarViewDate: null,
      allNotes: null,
      yearCompletions: {},
      appointmentsByDate: {},
      appointmentFormOpen: false,
      editingAppointmentId: null,
      allAppointments: null,
      quickAddOpen: false,
      quickAddDefaults: null,
      planHabitSheet: null,    // { id } while the habit time sheet is open
      planScroll: null,        // null = scroll to "now" on next render
      planLastTouch: Date.now(),
    };

    const dayNames   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // ─── Helpers ─────────────────────────────────────────────────────────────────

    function getCompletions(date) {
      return state.completionsByDate[dateKey(date)] || {};
    }

    function getPrayers(date) {
      return state.prayersByDate[dateKey(date)] || { ...PRAYER_DEFAULT };
    }

    function isFutureDate(date) {
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(date); d.setHours(0,0,0,0);
      return d > today;
    }

    function isPastDate(date) {
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(date); d.setHours(0,0,0,0);
      return d < today;
    }

    function getHabitValue(habitId, date) {
      if (isFutureDate(date)) {
        const h = state.habits.find(h => h.id === habitId);
        if (!h) return false;
        if (h.type === 'number') return h.unit === 'am' ? '00:00' : null;
        return false;
      }
      const v = getCompletions(date)[habitId];
      return v === undefined ? false : v;
    }

    function prayerStatus(prayers, future) {
      if (future) return { dot:'#444441', text:'Incomplete' };
      if (prayers.menstruating) return { dot:'#7a3535', text:'Menstruating' };
      if (PRAYER_KEYS.every(k => prayers[k])) return { dot:'#d97757', text:'Complete' };
      return { dot:'#444441', text:'Incomplete' };
    }

    // Compute the date of the Nth weekday in a given month
    // nth: 1–4, or 5 = Last; weekday: 0 (Sun) – 6 (Sat)
    function getNthWeekday(year, month, nth, weekday) {
      const firstDay = new Date(year, month, 1);
      const firstOccurrence = ((weekday - firstDay.getDay()) + 7) % 7;
      const firstDayNum = 1 + firstOccurrence;

      if (nth === 5) {
        // "Last" occurrence: start from the first occurrence in the month
        // and step forward a week at a time — never overshoot past the
        // month, since not every month has a 5th occurrence of a weekday.
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let day = firstDayNum;
        while (day + 7 <= daysInMonth) day += 7;
        return day;
      }

      return firstDayNum + (nth - 1) * 7;
    }

    // A habit with a start date doesn't exist before it; one with an end date
    // stops after it (end date is inclusive). No dates means always active.
    function isWide() { return window.innerWidth >= 700; }

    // Week / Month / Year tables: fill the width and use bigger cells on wide screens.
    function wideTable(html) {
      if (!isWide()) return html;
      return html
        .split('width:auto;border-collapse').join('width:100%;border-collapse')
        .split('width:10px;height:10px').join('width:14px;height:14px')
        .split('padding:3px 2px').join('padding:5px 2px');
    }

    function habitActiveOn(h, date) {
      const k = dateKey(date);
      if (h.start_date && k < String(h.start_date).slice(0, 10)) return false;
      if (h.end_date   && k > String(h.end_date).slice(0, 10))   return false;
      return true;
    }

    function isMonthlyHabitDueToday(habit, date) {
      if (habit.days && habit.days.length === 2) {
        // New format: [nth, weekday]
        const dueDay = getNthWeekday(date.getFullYear(), date.getMonth(), habit.days[0], habit.days[1]);
        return date.getDate() === dueDay;
      } else if (habit.day) {
        // Legacy: specific day of month
        return date.getDate() === habit.day;
      }
      return false;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─── Data loading ─────────────────────────────────────────────────────────────

    function parseCompletionValue(val) {
      if (val === 'true')  return true;
      if (val === 'false') return false;
      return val;
    }

    async function loadCompletionsForDate(date) {
      const key = dateKey(date);
      if (state.completionsByDate[key] !== undefined) return;

      const { data } = await db.from('completions')
        .select('habit_id, value')
        .eq('user_id', currentUser.id)
        .eq('date', key);

      const completions = {};
      let prayers = { ...PRAYER_DEFAULT };

      (data || []).forEach(c => {
        if (c.habit_id === state.prayerHabitId) {
          try { prayers = { ...PRAYER_DEFAULT, ...JSON.parse(c.value) }; } catch(e) {}
        } else {
          completions[c.habit_id] = parseCompletionValue(c.value);
        }
      });

      state.completionsByDate[key] = completions;
      state.prayersByDate[key]     = prayers;
    }

    async function loadNoteForDate(date) {
      const key = dateKey(date);
      if (state.dailyNotes[key] !== undefined) return;

      const { data } = await db.from('daily_notes')
        .select('content')
        .eq('user_id', currentUser.id)
        .eq('date', key)
        .maybeSingle();

      state.dailyNotes[key] = data?.content || '';
    }

    async function loadAppointmentsForDate(date) {
      const key = dateKey(date);
      if (state.appointmentsByDate[key] !== undefined) return;

      const { data } = await db.from('appointments')
        .select('*')
        .eq('user_id', currentUser.id)
        .eq('date', key)
        .order('time', { ascending: true, nullsFirst: false });

      state.appointmentsByDate[key] = data || [];
    }

    // Always re-reads the range so the Plan week view (and an iPad left open
    // on it) never shows stale data.
    async function loadAppointmentsForRange(startDate, endDate) {
      const { data } = await db.from('appointments')
        .select('*')
        .eq('user_id', currentUser.id)
        .gte('date', dateKey(startDate))
        .lte('date', dateKey(endDate))
        .order('time', { ascending: true, nullsFirst: false });

      const byDate = {};
      (data || []).forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });

      const d = new Date(startDate);
      while (d <= endDate) {
        const k = dateKey(d);
        state.appointmentsByDate[k] = byDate[k] || [];
        d.setDate(d.getDate() + 1);
      }
    }

    async function loadCompletionsForRange(startDate, endDate) {
      const startKey = dateKey(startDate);
      const endKey   = dateKey(endDate);

      const { data } = await db.from('completions')
        .select('habit_id, date, value')
        .eq('user_id', currentUser.id)
        .gte('date', startKey)
        .lte('date', endKey);

      const byDate  = {};
      const prayers = {};

      (data || []).forEach(c => {
        if (!byDate[c.date])  byDate[c.date]  = {};
        if (!prayers[c.date]) prayers[c.date] = { ...PRAYER_DEFAULT };

        if (c.habit_id === state.prayerHabitId) {
          try { prayers[c.date] = { ...PRAYER_DEFAULT, ...JSON.parse(c.value) }; } catch(e) {}
        } else {
          byDate[c.date][c.habit_id] = parseCompletionValue(c.value);
        }
      });

      let d = new Date(startDate);
      while (d <= endDate) {
        const k = dateKey(d);
        state.completionsByDate[k] = byDate[k]  || {};
        state.prayersByDate[k]     = prayers[k] || { ...PRAYER_DEFAULT };
        d.setDate(d.getDate() + 1);
      }
    }

    async function loadCompletionsForYear(year) {
      const startKey = `${year}-01-01`;
      const endKey   = `${year}-12-31`;

      const { data } = await db.from('completions')
        .select('habit_id, date, value')
        .eq('user_id', currentUser.id)
        .gte('date', startKey)
        .lte('date', endKey);

      const byHabitMonth = {};
      (data || []).forEach(c => {
        const monthKey = c.date.substring(5, 7);
        const key = `${c.habit_id}_${monthKey}`;
        if (c.value === 'true' || (c.value && c.value !== 'false' && c.value !== '')) {
          byHabitMonth[key] = true;
        } else if (byHabitMonth[key] === undefined) {
          byHabitMonth[key] = false;
        }
      });

      state.yearCompletions = byHabitMonth;
    }

    async function loadAllNotes() {
      if (state.allNotes !== null) return;

      const { data } = await db.from('daily_notes')
        .select('date, content')
        .eq('user_id', currentUser.id)
        .order('date', { ascending: false });

      state.allNotes = (data || []).filter(n => n.content && n.content.trim());
    }

    async function loadAllAppointments() {
      if (state.allAppointments !== null) return;

      const { data } = await db.from('appointments')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('date', { ascending: true });

      state.allAppointments = data || [];
    }

    // ─── Mutations ────────────────────────────────────────────────────────────────

    async function upsertCompletion(habitId, key, value) {
      const valueStr = value === true ? 'true' : value === false ? 'false' : String(value ?? '');
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: habitId, date: key, value: valueStr },
        { onConflict: 'habit_id,date' }
      );
    }

    async function setHabit(habitId, value) {
      const key = dateKey(state.selectedDate);
      if (!state.completionsByDate[key]) state.completionsByDate[key] = {};
      state.completionsByDate[key][habitId] = value;
      render();
      await upsertCompletion(habitId, key, value);
    }

    async function togglePrayer(prayerId) {
      const key = dateKey(state.selectedDate);
      if (!state.prayersByDate[key]) state.prayersByDate[key] = { ...PRAYER_DEFAULT };
      state.prayersByDate[key][prayerId] = !state.prayersByDate[key][prayerId];
      render();

      if (!state.prayerHabitId) return;
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: state.prayerHabitId, date: key, value: JSON.stringify(state.prayersByDate[key]) },
        { onConflict: 'habit_id,date' }
      );
    }

    async function toggleMenstruating() {
      const key = dateKey(state.selectedDate);
      if (!state.prayersByDate[key]) state.prayersByDate[key] = { ...PRAYER_DEFAULT };
      state.prayersByDate[key].menstruating = !state.prayersByDate[key].menstruating;
      render();

      if (!state.prayerHabitId) return;
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: state.prayerHabitId, date: key, value: JSON.stringify(state.prayersByDate[key]) },
        { onConflict: 'habit_id,date' }
      );
    }

    async function saveNote(value) {
      const key = dateKey(state.selectedDate);
      state.dailyNotes[key] = value;
      state.allNotes = null; // invalidate notes cache
      await db.from('daily_notes').upsert(
        { user_id: currentUser.id, date: key, content: value },
        { onConflict: 'user_id,date' }
      );
    }

    // ─── Appointments ─────────────────────────────────────────────────────────────

    // The Plan tab stores a block's length in appointments.duration_min. If the
    // column has not been added yet, fall back to saving without it so nothing
    // is lost, and say so in the console.
    async function writeAppointment(payload, editingId) {
      const wantedWork = !!payload.is_work;
      const run = (p) => editingId
        ? db.from('appointments').update(p).eq('id', editingId)
        : db.from('appointments').insert(p);

      let { error } = await run(payload);
      if (error && 'is_work' in payload) {
        const { is_work, ...rest } = payload;
        ({ error } = await run(rest));
        if (!error) { payload = rest; console.warn('appointments.is_work is missing, so the Work tag was not saved. Run the migration.'); }
      }
      if (error && 'duration_min' in payload) {
        const { duration_min, ...rest } = payload;
        ({ error } = await run(rest));
        if (!error) console.warn('appointments.duration_min is missing, so the length was not saved. Run the migration.');
      }
      if (!error && wantedWork && !('is_work' in payload)) alert('Saved, but the Work tag was not stored. Run plan_migration.sql in Supabase first.');
      if (error) { alert('Could not save: ' + error.message); return false; }
      return true;
    }

    function openAppointmentForm(id) {
      state.appointmentFormOpen = true;
      state.editingAppointmentId = id || null;
      render();
    }

    function closeAppointmentForm() {
      state.appointmentFormOpen = false;
      state.editingAppointmentId = null;
      render();
    }

    async function saveAppointment(formEl) {
      const key      = dateKey(state.selectedDate);
      const title    = formEl.title.value.trim();
      const newDate  = (formEl.date && formEl.date.value) || key;
      const time     = formEl.time.value.trim();
      const notes    = formEl.notes.value.trim();
      const duration = parseInt(formEl.duration.value, 10) || 60;
      const section  = deriveSection(time);
      const habitId  = formEl.habit_id.value || null;
      if (!title) return;

      const editingId = state.editingAppointmentId;
      const payload = {
        user_id: currentUser.id, date: newDate,
        title, time: time || null, notes: notes || null,
        section, habit_id: habitId, duration_min: duration, is_work: !!formEl.is_work.checked,
      };

      const ok = await writeAppointment(payload, editingId);
      if (!ok) return;

      // Off-schedule habit logging: linking an appointment to a habit
      // also marks that habit complete for the appointment's date.
      if (habitId) {
        if (newDate === key) {
          await setHabit(habitId, true);
        } else {
          await upsertCompletion(habitId, newDate, true);
          if (state.completionsByDate[newDate]) state.completionsByDate[newDate][habitId] = true;
        }
      }

      state.appointmentsByDate[key] = undefined;     // invalidate caches
      state.appointmentsByDate[newDate] = undefined;
      state.allAppointments = null;
      closeAppointmentForm();
      await loadTabData();
      render();
    }

    async function setAppointmentStatus(id, value) {
      const key = dateKey(state.selectedDate);
      const list = state.appointmentsByDate[key] || [];
      const appt = list.find(a => a.id === id);
      if (appt) appt.completed = value;
      render();

      await db.from('appointments').update({ completed: value }).eq('id', id);
      state.allAppointments = null; // invalidate global list cache (status shown there too)
    }

    async function deleteAppointment(id) {
      const key = dateKey(state.selectedDate);
      await db.from('appointments').delete().eq('id', id);
      state.appointmentsByDate[key] = (state.appointmentsByDate[key] || []).filter(a => a.id !== id);
      state.allAppointments = null; // invalidate global list cache
      closeAppointmentForm();
    }

    // ─── Quick-add (global) ──────────────────────────────────────────────────────

    function toggleQuickAdd() {
      state.quickAddOpen = !state.quickAddOpen;
      state.quickAddDefaults = null;
      render();
    }

    function closeQuickAdd() {
      state.quickAddOpen = false;
      state.quickAddDefaults = null;
      render();
    }

    async function saveQuickAppointment(formEl) {
      const title    = formEl.title.value.trim();
      const dateStr  = formEl.date.value; // already YYYY-MM-DD from <input type="date">
      const time     = formEl.time.value.trim();
      const notes    = formEl.notes.value.trim();
      const duration = parseInt(formEl.duration.value, 10) || 60;
      const section  = deriveSection(time);
      const habitId  = formEl.habit_id.value || null;
      if (!title || !dateStr) return;

      const ok = await writeAppointment({
        user_id: currentUser.id, date: dateStr,
        title, time: time || null, notes: notes || null,
        section, habit_id: habitId, duration_min: duration, is_work: !!formEl.is_work.checked,
      }, null);
      if (!ok) return;

      if (habitId) {
        await upsertCompletion(habitId, dateStr, true);
        if (state.completionsByDate[dateStr]) state.completionsByDate[dateStr][habitId] = true;
      }

      // Invalidate any caches that might now be stale
      state.appointmentsByDate[dateStr] = undefined;
      state.allAppointments = null;

      state.quickAddOpen = false;
      state.quickAddDefaults = null;
      render();

      // Refresh whatever the current tab shows (Today, Plan day/week, Appts).
      await loadTabData();
      render();
    }

    function goToAppointmentDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      state.selectedDate = new Date(y, m - 1, d);
      state.activeTab = 'daily';
      state.calendarOpen = false;
      state.appointmentFormOpen = false;
      state.editingAppointmentId = null;
      loadTabData().then(render);
    }

    // ─── Navigation ───────────────────────────────────────────────────────────────

    async function setActiveTab(tab) {
      state.activeTab = tab;
      if (tab === 'plan') state.planScroll = null;
      state.calendarOpen = false;
      await loadTabData();
      render();
    }

    async function changeDate(days) {
      const d = new Date(state.selectedDate);
      d.setDate(d.getDate() + days);
      state.selectedDate = d;
      state.calendarOpen = false;
      state.appointmentFormOpen = false;
      state.editingAppointmentId = null;
      await loadTabData();
      render();
    }

    async function changeMonth(months) {
      const d = new Date(state.selectedDate);
      d.setMonth(d.getMonth() + months);
      state.selectedDate = d;
      await loadTabData();
      render();
    }

    async function changeYear(years) {
      const d = new Date(state.selectedDate);
      d.setFullYear(d.getFullYear() + years);
      state.selectedDate = d;
      state.yearCompletions = {}; // invalidate year cache
      await loadTabData();
      render();
    }

    async function goToToday() {
      state.selectedDate = new Date();
      state.activeTab = 'daily';
      state.calendarOpen = false;
      state.appointmentFormOpen = false;
      state.editingAppointmentId = null;
      await loadTabData();
      render();
    }

    // Mini-calendar
    function toggleCalendar() {
      state.calendarOpen = !state.calendarOpen;
      if (state.calendarOpen) {
        state.calendarViewDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1);
      }
      render();
    }

    function closeCalendar() {
      state.calendarOpen = false;
      render();
    }

    function calendarPrevMonth() {
      state.calendarViewDate = new Date(state.calendarViewDate.getFullYear(), state.calendarViewDate.getMonth() - 1, 1);
      render();
    }

    function calendarNextMonth() {
      state.calendarViewDate = new Date(state.calendarViewDate.getFullYear(), state.calendarViewDate.getMonth() + 1, 1);
      render();
    }

    async function selectCalendarDate(y, m, d) {
      state.selectedDate = new Date(y, m, d);
      state.calendarOpen = false;
      state.appointmentFormOpen = false;
      state.editingAppointmentId = null;
      await loadTabData();
      render();
    }

    function goToSettings() { window.location.href = 'habit_tracker_manage_habits_mockup.html'; }
    function goToProfile()  { window.location.href = 'habit_tracker_profile.html'; }

    async function loadTabData() {
      const tab  = state.activeTab;
      const date = state.selectedDate;

      if (tab === 'daily' || tab === 'prayer') {
        await Promise.all([loadCompletionsForDate(date), loadNoteForDate(date), loadAppointmentsForDate(date)]);
      } else if (tab === 'plan') {
        const days = planDays();
        await Promise.all([
          loadAppointmentsForRange(days[0], days[6]),
          loadCompletionsForRange(days[0], days[6]),
        ]);
      } else if (tab === 'appointments') {
        await loadAllAppointments();
      } else if (tab === 'weekly') {
        const dow   = date.getDay();
        const start = new Date(date); start.setDate(date.getDate() - dow);
        const end   = new Date(start); end.setDate(start.getDate() + 6);
        await loadCompletionsForRange(start, end);
      } else if (tab === 'monthly') {
        const start = new Date(date.getFullYear(), date.getMonth(), 1);
        const end   = new Date(date.getFullYear(), date.getMonth() + 1, 0);
        await loadCompletionsForRange(start, end);
      } else if (tab === 'year') {
        await loadCompletionsForYear(date.getFullYear());
      } else if (tab === 'notes') {
        await loadAllNotes();
      }
    }

    // ─── Render helpers ───────────────────────────────────────────────────────────

    function renderHabitItem(habit) {
      const value = getHabitValue(habit.id, state.selectedDate);

      if (habit.type === 'number') {
        const suffix      = habit.unit || '';
        const placeholder = habit.unit === 'am' ? '00:00' : '0.0';
        return `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${habit.name}</p></div>
            <input type="text" value="${escapeHtml(String(value || ''))}"
              onchange="setHabit('${habit.id}', this.value)"
              placeholder="${placeholder}"
              style="width:60px;text-align:right;background:#0a0a0a;border:1px solid #2a2925;color:#f5f1ed;padding:5px 8px;border-radius:4px;font-size:12px;outline:none;" />
            <span style="color:#8a8985;font-size:11px;">${suffix}</span>
          </div>`;
      }

      return `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
          <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${habit.name}</p></div>
          <button onclick="setHabit('${habit.id}',false)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${!value?'#2a2925':'#141411'};color:#8a8985;cursor:pointer;font-size:14px;">✕</button>
          <button onclick="setHabit('${habit.id}',true)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${value?'#d97757':'#141411'};color:${value?'#0a0a0a':'#8a8985'};cursor:pointer;font-weight:600;">✓</button>
        </div>`;
    }

    function renderSection(title, items) {
      if (!items.length) return '';
      return `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">${title}</p>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${items.map(item => item.__appointment ? renderAppointmentItem(item) : renderHabitItem(item)).join('')}
          </div>
        </div>`;
    }

    // dateObj optional: used for weekly habits to check due-day
    function renderGridCell(h, k, dateObj) {
      if (h.id === state.prayerHabitId) {
        const dp = state.prayersByDate[k] || {};
        let bg = '#2a2925', op = 0.4;
        if (dp.menstruating) { bg = '#7a3535'; op = 1; }
        else if (PRAYER_KEYS.every(pk => dp[pk])) { bg = '#d97757'; op = 1; }
        return `<div style="width:10px;height:10px;border-radius:2px;background:${bg};opacity:${op};margin:0 auto;"></div>`;
      }

      if (dateObj && !habitActiveOn(h, dateObj)) {
        const logged = (state.completionsByDate[k] || {})[h.id];
        if (!(logged === true || logged === 'true')) {
          return `<div style="width:10px;height:10px;margin:0 auto;"></div>`;
        }
      }

      // Weekly habits: on a day the habit isn't normally scheduled, leave
      // the cell blank UNLESS a completion actually exists for that day —
      // e.g. logged off-schedule via a habit-linked appointment. A real
      // completion should never be hidden just because it landed on an
      // unscheduled day.
      if (h.frequency === 'weekly' && dateObj) {
        const scheduled = h.days && h.days.includes(dateObj.getDay());
        const hasCompletion = (state.completionsByDate[k] || {})[h.id];
        const isDone = hasCompletion === true || hasCompletion === 'true';
        if (!scheduled && !isDone) {
          return `<div style="width:10px;height:10px;margin:0 auto;"></div>`;
        }
      }

      const val  = (state.completionsByDate[k] || {})[h.id];
      const done = h.type === 'number'
        ? (val !== null && val !== undefined && val !== '' && val !== false && val !== 'false')
        : (val === true || val === 'true');
      return `<div style="width:10px;height:10px;border-radius:2px;background:${done?'#d97757':'#2a2925'};opacity:${done?1:0.4};margin:0 auto;"></div>`;
    }

    // ─── Calendar overlay ─────────────────────────────────────────────────────────

    function renderCalendarOverlay() {
      if (!state.calendarOpen || !state.calendarViewDate) return '';

      const cvd  = state.calendarViewDate;
      const year = cvd.getFullYear();
      const month = cvd.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const selectedKey = dateKey(state.selectedDate);
      const todayKey    = dateKey(new Date());
      const shortDays   = ['S','M','T','W','T','F','S'];

      let cells = shortDays.map(d =>
        `<div style="text-align:center;color:#5a5955;font-size:9px;padding:3px 0;">${d}</div>`
      ).join('');

      for (let i = 0; i < firstDay; i++) cells += `<div></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const k = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const isSelected = k === selectedKey;
        const isToday    = k === todayKey;
        const bg    = isSelected ? '#d97757' : isToday ? '#2a2925' : 'transparent';
        const color = isSelected ? '#0a0a0a' : '#8a8985';
        const fw    = isSelected || isToday ? '600' : '400';
        cells += `<button onclick="selectCalendarDate(${year},${month},${day})"
          style="background:${bg};border:none;color:${color};font-size:11px;font-weight:${fw};border-radius:3px;padding:5px 0;cursor:pointer;font-family:inherit;text-align:center;">${day}</button>`;
      }

      return `
        <div onclick="closeCalendar()"
          style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;">
          <div onclick="event.stopPropagation()"
            style="background:#141411;border:1px solid #2a2925;border-radius:6px;padding:14px;width:256px;max-width:92vw;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <button onclick="calendarPrevMonth()"
                style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:2px 8px;line-height:1;">‹</button>
              <span style="color:#f5f1ed;font-size:11px;font-weight:600;letter-spacing:0.3px;">${monthNames[month]} ${year}</span>
              <button onclick="calendarNextMonth()"
                style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:2px 8px;line-height:1;">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
              ${cells}
            </div>
          </div>
        </div>`;
    }

    // ─── View renderers ───────────────────────────────────────────────────────────

    function formatApptTime(t) {
      if (!t) return '';
      const [h, m] = t.split(':').map(Number);
      if (isNaN(h)) return t;
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${String(m||0).padStart(2,'0')} ${period}`;
    }

    function renderAppointmentItem(appt) {
      const value = !!appt.completed;
      const meta  = appt.time ? formatApptTime(appt.time) : '';
      const past  = isPastDate(new Date(appt.date + 'T00:00:00'));
      const labelAttrs = past ? '' : `onclick="openAppointmentForm('${appt.id}')" style="cursor:pointer;"`;

      return `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:${appt.is_work ? 'rgba(91,155,213,0.08)' : '#141411'};border-radius:4px;border:1px solid ${appt.is_work ? '#5b9bd5' : '#2a2925'};">
          <div style="flex:1;min-width:0;" ${labelAttrs}>
            <p style="color:${appt.is_work ? '#9cc4ea' : '#f5f1ed'};font-size:12px;font-weight:400;">${escapeHtml(appt.title)}</p>
            ${meta ? `<p style="color:#8a8985;font-size:10px;margin-top:2px;">${escapeHtml(meta)}</p>` : ''}
          </div>
          <button onclick="setAppointmentStatus('${appt.id}',false)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${!value?'#2a2925':'#141411'};color:#8a8985;cursor:pointer;font-size:14px;">✕</button>
          <button onclick="setAppointmentStatus('${appt.id}',true)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${value?(appt.is_work?'#5b9bd5':'#d97757'):'#141411'};color:${value?'#0a0a0a':'#8a8985'};cursor:pointer;font-weight:600;">✓</button>
        </div>`;
    }

    function renderAppointmentEditModal() {
      if (!state.appointmentFormOpen) return '';
      const key       = dateKey(state.selectedDate);
      const editingId = state.editingAppointmentId;
      const editing   = editingId ? (state.appointmentsByDate[key] || []).find(a => a.id === editingId) : null;
      if (!editing) return '';

      const activeHabits = state.habits.filter(h => !h.archived && h.frequency !== 'daily');
      const habitOptions = activeHabits.map(h =>
        `<option value="${h.id}" ${editing.habit_id === h.id ? 'selected' : ''}>${escapeHtml(h.name)}</option>`
      ).join('');
      const inputStyle = 'width:100%;background:#0a0a0a;border:1px solid #2a2925;color:#f5f1ed;border-radius:4px;padding:9px 10px;font-size:12px;font-family:inherit;outline:none;';

      return `
        <div onclick="closeAppointmentForm()"
          style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;">
          <div onclick="event.stopPropagation()"
            style="background:#141411;border:1px solid #2a2925;border-top-left-radius:10px;border-top-right-radius:10px;padding:16px;width:100%;max-width:480px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:12px;">Edit Appointment</p>
            <form onsubmit="event.preventDefault();saveAppointment(this);" style="display:flex;flex-direction:column;gap:8px;">
              <input name="title" placeholder="Title" required value="${escapeHtml(editing.title)}" style="${inputStyle}">
              <div style="display:flex;gap:8px;">
                <input name="date" type="date" required value="${editing.date}" style="${inputStyle};flex:1;">
                <input name="time" type="time" value="${editing.time || ''}" style="${inputStyle};flex:1;">
              </div>
              ${planDurationSelect(editing.duration_min || 60, inputStyle)}
              <textarea name="notes" placeholder="Notes (optional)" style="${inputStyle};resize:none;min-height:48px;">${editing.notes ? escapeHtml(editing.notes) : ''}</textarea>
<div style="display:flex;gap:8px;align-items:center;">
                <select name="habit_id" style="${inputStyle};flex:1;">
                  <option value="">No linked habit</option>
                  ${habitOptions}
                </select>
                <label style="flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:#5b9bd5;cursor:pointer;white-space:nowrap;">
                  <input type="checkbox" name="is_work" ${editing.is_work ? 'checked ' : ''}style="width:16px;height:16px;accent-color:#5b9bd5;margin:0;"> Work
                </label>
              </div>
              <p style="color:#7a7570;font-size:9px;">Linking a habit marks it complete for this day. Work shows in blue.</p>
              <div style="display:flex;gap:8px;">
                <button type="submit" style="flex:1;background:#d97757;border:none;color:#0a0a0a;border-radius:4px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;">Save</button>
                <button type="button" onclick="closeAppointmentForm()" style="flex:1;background:none;border:1px solid #2a2925;color:#8a8985;border-radius:4px;padding:9px;font-size:12px;cursor:pointer;">Cancel</button>
              </div>
              <button type="button" onclick="deleteAppointment('${editing.id}')" style="background:none;border:none;color:#7a7570;font-size:10px;cursor:pointer;padding:6px 0;text-align:center;">Delete appointment</button>
            </form>
          </div>
        </div>`;
    }

    function renderDailyView() {
      const dow    = state.selectedDate.getDay();
      const key    = dateKey(state.selectedDate);
      const future = isFutureDate(state.selectedDate);

      // Appointments slot into Morning/Evening alongside habits, styled
      // and toggled the same way. Anything without a section (shouldn't
      // happen for newly created ones, but covers pre-migration rows)
      // falls back to Evening.
      const dayAppointments = (state.appointmentsByDate[key] || []).map(a => ({ ...a, __appointment: true }));
      const morningAppts = dayAppointments.filter(a => a.section === 'morning');
      const eveningAppts = dayAppointments.filter(a => a.section !== 'morning');

      const morningHabits = [
        ...state.habits.filter(h =>
          h.frequency === 'daily' && h.section === 'morning' && h.id !== state.prayerHabitId && habitActiveOn(h, state.selectedDate)
        ),
        ...morningAppts,
      ];
      const eveningHabits = [
        ...eveningAppts,
        ...state.habits.filter(h =>
          h.frequency === 'daily' && h.section === 'evening' && h.id !== state.prayerHabitId && habitActiveOn(h, state.selectedDate)
        ),
        ...state.habits.filter(h =>
          h.frequency === 'weekly' && h.days && h.days.includes(dow) && h.section === 'evening' && habitActiveOn(h, state.selectedDate)
        ),
      ];
      const weeklyHabits = state.habits.filter(h =>
        h.frequency === 'weekly' && h.days && h.days.includes(dow) && !h.section && habitActiveOn(h, state.selectedDate)
      );
      const monthlyHabits = state.habits.filter(h =>
        h.frequency === 'monthly' && isMonthlyHabitDueToday(h, state.selectedDate) && habitActiveOn(h, state.selectedDate)
      );

      const prayers        = getPrayers(state.selectedDate);
      const status         = prayerStatus(prayers, future);
      const hasPrayerHabit = !!state.prayerHabitId;

      const prayerRow = hasPrayerHabit ? `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">Prayer</p>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">Prayers</p></div>
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:6px;height:6px;border-radius:50%;background:${status.dot};"></div>
              <span style="color:#8a8985;font-size:11px;">${status.text}</span>
            </div>
          </div>
        </div>` : '';

      const savedNote = state.dailyNotes[key] || '';
      const notesRow  = `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">Notes</p>
          <textarea onchange="saveNote(this.value)" placeholder="Add a note for today…"
            style="width:100%;background:#141411;border:1px solid #2a2925;color:#f5f1ed;border-radius:4px;padding:9px 12px;font-size:12px;font-family:inherit;resize:none;min-height:72px;outline:none;transition:border-color 0.2s;"
            onfocus="this.style.borderColor='#d97757'" onblur="this.style.borderColor='#2a2925'"
          >${escapeHtml(savedNote)}</textarea>
        </div>`;

      const wide = isWide();
      const wrapStyle = wide
        ? 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;align-items:start;'
        : 'display:flex;flex-direction:column;gap:12px;';
      const notesBlock = wide ? notesRow.replace('<div>', '<div style="grid-column:1/-1;">') : notesRow;
      return `<div style="${wrapStyle}">
        ${renderSection('Morning', morningHabits)}
        ${renderSection('Evening', eveningHabits)}
        ${prayerRow}
        ${weeklyHabits.length  ? renderSection('Weekly',  weeklyHabits)  : ''}
        ${monthlyHabits.length ? renderSection('Monthly', monthlyHabits) : ''}
        ${notesBlock}
      </div>`;
    }

    function renderPrayerView() {
      const prayerList = [
        { id:'fajr',    label:'Fajr'    },
        { id:'dhuhr',   label:'Dhuhr'   },
        { id:'asr',     label:'Asr'     },
        { id:'maghrib', label:'Maghrib' },
        { id:'isha',    label:'Isha'    },
      ];
      const prayers       = getPrayers(state.selectedDate);
      const future        = isFutureDate(state.selectedDate);
      const isMenstruating = prayers.menstruating;
      const status        = prayerStatus(prayers, future);

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="margin-bottom:4px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">Status</p>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
              <div style="width:6px;height:6px;border-radius:50%;background:${status.dot};"></div>
              <p style="color:#f5f1ed;font-size:12px;font-weight:400;flex:1;">${status.text}</p>
            </div>
          </div>

          <div>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">Menstruating</p>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
              <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">No prayers required</p></div>
              <button onclick="toggleMenstruating()"
                style="width:40px;height:24px;border-radius:12px;border:none;background:${isMenstruating?'#7a3535':'#2a2925'};cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0;">
                <div style="position:absolute;width:20px;height:20px;background:#0a0a0a;border-radius:50%;top:2px;left:${isMenstruating?'18px':'2px'};transition:left 0.2s;"></div>
              </button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;${isMenstruating?'opacity:0.4;pointer-events:none;':''}">`;

      prayerList.forEach(p => {
        const done = !future && !isMenstruating && prayers[p.id];
        html += `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${p.label}</p></div>
            <button onclick="togglePrayer('${p.id}')"
              style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${done?'#d97757':'#141411'};color:${done?'#0a0a0a':'#8a8985'};cursor:pointer;font-weight:600;">✓</button>
          </div>`;
      });

      html += `</div></div>`;
      return html;
    }

    function renderWeeklyView() {
      const dow         = state.selectedDate.getDay();
      const startOfWeek = new Date(state.selectedDate);
      startOfWeek.setDate(state.selectedDate.getDate() - dow);

      // Bug fix: include weekly habits in the matrix
      const gridHabits    = state.habits.filter(h => h.frequency === 'daily' || h.frequency === 'weekly');
      const dayShortNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">
            Week of ${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()}
          </p>
          <div style="background:#141411;border-radius:6px;border:1px solid #2a2925;padding:8px;overflow-x:auto;">
            <table style="width:auto;border-collapse:collapse;font-size:10px;">
              <thead><tr><th style="width:28px;padding-right:4px;"></th>`;

      gridHabits.forEach(h => {
        html += `<th style="padding:4px 2px;width:24px;height:100px;">
          <p style="color:#f5f1ed;font-weight:400;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;">${h.name}</p>
        </th>`;
      });

      html += `</tr></thead><tbody>`;

      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i);
        const k = dateKey(d);

        html += `<tr style="border-top:1px solid #2a2925;">
          <td style="padding:3px 4px;text-align:right;color:#7a7570;font-size:9px;font-weight:600;">${dayShortNames[d.getDay()]}</td>`;

        gridHabits.forEach(h => {
          html += `<td style="padding:3px 2px;text-align:center;">${renderGridCell(h, k, d)}</td>`;
        });

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
      return wideTable(html);
    }

    function renderMonthlyView() {
      const year        = state.selectedDate.getFullYear();
      const month       = state.selectedDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Bug fix: include weekly habits in the matrix
      const gridHabits  = state.habits.filter(h => h.frequency === 'daily' || h.frequency === 'weekly');

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">
            ${monthNames[month]} ${year}
          </p>
          <div style="background:#141411;border-radius:6px;border:1px solid #2a2925;padding:8px;overflow-x:auto;">
            <table style="width:auto;border-collapse:collapse;font-size:10px;">
              <thead><tr><th style="width:28px;padding-right:4px;"></th>`;

      gridHabits.forEach(h => {
        html += `<th style="padding:4px 2px;width:24px;height:100px;">
          <p style="color:#f5f1ed;font-weight:400;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;">${h.name}</p>
        </th>`;
      });

      html += `</tr></thead><tbody>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const k = dateKey(dateObj);

        html += `<tr style="border-top:1px solid #2a2925;">
          <td style="padding:3px 4px;text-align:right;color:#7a7570;font-size:9px;font-weight:600;">${day}</td>`;

        gridHabits.forEach(h => {
          html += `<td style="padding:3px 2px;text-align:center;">${renderGridCell(h, k, dateObj)}</td>`;
        });

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
      return wideTable(html);
    }

    function renderYearView() {
      const year = state.selectedDate.getFullYear();
      const habits = state.habits.filter(h =>
        h.frequency === 'monthly' || h.frequency === 'quarterly'
      );

      if (habits.length === 0) {
        return `<div style="text-align:center;padding:40px 20px;color:#7a7570;font-size:12px;">No monthly or quarterly habits yet.</div>`;
      }

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="background:#141411;border-radius:6px;border:1px solid #2a2925;padding:8px;overflow-x:auto;">
            <table style="width:auto;border-collapse:collapse;font-size:10px;">
              <thead><tr><th style="width:32px;padding-right:4px;text-align:left;"></th>`;

      habits.forEach(h => {
        html += `<th style="padding:4px 2px;width:24px;height:100px;">
          <p style="color:#f5f1ed;font-weight:400;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;">${h.name}</p>
        </th>`;
      });

      html += `</tr></thead><tbody>`;

      for (let m = 0; m < 12; m++) {
        const monthKey = String(m + 1).padStart(2, '0');
        html += `<tr style="border-top:1px solid #2a2925;">
          <td style="padding:3px 6px 3px 2px;text-align:right;color:#7a7570;font-size:9px;font-weight:600;">${monthShort[m]}</td>`;

        habits.forEach(h => {
          const key  = `${h.id}_${monthKey}`;
          const done = !!state.yearCompletions[key];
          const mFirst = `${year}-${monthKey}-01`;
          const mLast  = `${year}-${monthKey}-${String(new Date(year, m + 1, 0).getDate()).padStart(2, '0')}`;
          const outside = (h.start_date && String(h.start_date).slice(0, 10) > mLast) || (h.end_date && String(h.end_date).slice(0, 10) < mFirst);
          if (outside && !done) { html += `<td style="padding:3px 2px;"><div style="width:10px;height:10px;margin:0 auto;"></div></td>`; return; }
          html += `<td style="padding:3px 2px;text-align:center;">
            <div style="width:10px;height:10px;border-radius:2px;background:${done?'#d97757':'#2a2925'};opacity:${done?1:0.4};margin:0 auto;"></div>
          </td>`;
        });

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
      return wideTable(html);
    }

    function renderNotesView() {
      if (!state.allNotes || state.allNotes.length === 0) {
        return `<div style="text-align:center;padding:40px 20px;color:#7a7570;font-size:12px;">No notes recorded yet.</div>`;
      }

      const entries = state.allNotes.map(note => {
        const d = new Date(note.date + 'T00:00:00');
        const label = `${dayNames[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        return `
          <div style="background:#141411;border:1px solid #2a2925;border-radius:4px;padding:12px 14px;margin-bottom:8px;">
            <p style="color:#8a8985;font-size:9px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">${label}</p>
            <p style="color:#f5f1ed;font-size:12px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(note.content)}</p>
          </div>`;
      }).join('');

      return isWide() ? `<div style="column-count:2;column-gap:12px;">${entries.split('margin-bottom:8px;').join('margin-bottom:12px;break-inside:avoid;')}</div>` : `<div>${entries}</div>`;
    }

    function cardGrid(inner) {
      return isWide() ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:12px;">${inner}</div>` : inner;
    }

    function renderAppointmentsTabView() {
      if (!state.allAppointments || state.allAppointments.length === 0) {
        return `<div style="text-align:center;padding:40px 20px;color:#7a7570;font-size:12px;">No appointments yet.</div>`;
      }

      const todayKey = dateKey(new Date());
      const upcoming = state.allAppointments.filter(a => a.date >= todayKey);
      const past     = state.allAppointments.filter(a => a.date < todayKey).slice().reverse();

      function entry(a) {
        const d = new Date(a.date + 'T00:00:00');
        const label = `${dayNames[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}`;
        const meta = a.time ? formatApptTime(a.time) : '';
        return `
          <button onclick="goToAppointmentDate('${a.date}')"
            style="display:block;width:100%;text-align:left;background:${a.is_work ? 'rgba(91,155,213,0.08)' : '#141411'};border:1px solid ${a.is_work ? '#5b9bd5' : '#2a2925'};border-radius:4px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;">
            <p style="color:#8a8985;font-size:9px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">${label}</p>
            <p style="color:${a.is_work ? '#9cc4ea' : '#f5f1ed'};font-size:12px;">${escapeHtml(a.title)}</p>
            ${meta ? `<p style="color:#7a7570;font-size:10px;margin-top:2px;">${escapeHtml(meta)}</p>` : ''}
          </button>`;
      }

      const upcomingHtml = upcoming.length
        ? `<p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;">Upcoming</p>${cardGrid(upcoming.map(entry).join(''))}`
        : '';
      const pastHtml = past.length
        ? `<p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin:${upcoming.length?'16px':'0'} 0 8px;">Past</p>${cardGrid(past.map(entry).join(''))}`
        : '';

      return `<div>${upcomingHtml}${pastHtml}</div>`;
    }

    function renderQuickAddModal() {
      if (!state.quickAddOpen) return '';

      const activeHabits = state.habits.filter(h => !h.archived && h.frequency !== 'daily');
      const habitOptions = activeHabits.map(h => `<option value="${h.id}">${escapeHtml(h.name)}</option>`).join('');
      const inputStyle = 'width:100%;background:#0a0a0a;border:1px solid #2a2925;color:#f5f1ed;border-radius:4px;padding:9px 10px;font-size:12px;font-family:inherit;outline:none;';
      const defaults = state.quickAddDefaults || {};
      const todayStr = defaults.date || dateKey(state.selectedDate);
      const timeStr  = defaults.time || '';

      return `
        <div onclick="closeQuickAdd()"
          style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;">
          <div onclick="event.stopPropagation()"
            style="background:#141411;border:1px solid #2a2925;border-top-left-radius:10px;border-top-right-radius:10px;padding:16px;width:100%;max-width:480px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:12px;">New Appointment</p>
            <form onsubmit="event.preventDefault();saveQuickAppointment(this);" style="display:flex;flex-direction:column;gap:8px;">
              <input name="title" placeholder="Title" required style="${inputStyle}">
              <div style="display:flex;gap:8px;">
                <input name="date" type="date" required value="${todayStr}" style="${inputStyle};flex:1;">
                <input name="time" type="time" value="${timeStr}" style="${inputStyle};flex:1;">
              </div>
              ${planDurationSelect(60, inputStyle)}
              <textarea name="notes" placeholder="Notes (optional)" style="${inputStyle};resize:none;min-height:48px;"></textarea>
<div style="display:flex;gap:8px;align-items:center;">
                <select name="habit_id" style="${inputStyle};flex:1;">
                  <option value="">No linked habit</option>
                  ${habitOptions}
                </select>
                <label style="flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:#5b9bd5;cursor:pointer;white-space:nowrap;">
                  <input type="checkbox" name="is_work" style="width:16px;height:16px;accent-color:#5b9bd5;margin:0;"> Work
                </label>
              </div>
              <p style="color:#7a7570;font-size:9px;">Linking a habit marks it complete for that day. Work shows in blue.</p>
              <div style="display:flex;gap:8px;margin-top:4px;">
                <button type="submit" style="flex:1;background:#d97757;border:none;color:#0a0a0a;border-radius:4px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;">Save</button>
                <button type="button" onclick="closeQuickAdd()" style="flex:1;background:none;border:1px solid #2a2925;color:#8a8985;border-radius:4px;padding:10px;font-size:12px;cursor:pointer;">Cancel</button>
              </div>
            </form>
          </div>
        </div>`;
    }

    // ─── Plan: hour-by-hour day and week view ─────────────────────────────────────
    // Time blocks are appointments. Start = appointments.time, length =
    // appointments.duration_min (60 when empty). Appointments with no time
    // appear in an "any time" strip above the grid.

    const PLAN_PX  = 1.2;
    const PLAN_WORK = { start: 9 * 60, end: 17 * 60 };   // work hours; Fri/Sat are shaded all day                                  // pixels per minute
    const PLAN_DUR = [15, 30, 45, 60, 90, 120, 180, 240];

    function planDurationLabel(d) {
      if (d < 60) return `${d} min`;
      const h = Math.floor(d / 60), m = d % 60;
      return m ? `${h} h ${m} min` : `${h} h`;
    }

    function planDurationSelect(selected, style) {
      const opts = PLAN_DUR.includes(selected) ? PLAN_DUR : [...PLAN_DUR, selected].sort((a, b) => a - b);
      return `<select name="duration" aria-label="Duration" style="${style};">${
        opts.map(d => `<option value="${d}" ${d === selected ? 'selected' : ''}>${planDurationLabel(d)}</option>`).join('')
      }</select>`;
    }

    function planHourLabel(h) {
      if (h === 0 || h === 24) return '12 AM';
      if (h === 12) return '12 PM';
      return h < 12 ? `${h} AM` : `${h - 12} PM`;
    }

    function planApptStart(a) {
      if (!a.time) return null;
      const [h, m] = a.time.split(':').map(Number);
      return isNaN(h) ? null : h * 60 + (m || 0);
    }

    function planApptDur(a) {
      const start = planApptStart(a) || 0;
      return Math.max(15, Math.min(a.duration_min || 60, 1440 - start));
    }

    // Sunday to Saturday around the selected date.
    function planDays() {
      const s = new Date(state.selectedDate);
      s.setDate(s.getDate() - s.getDay());
      return Array.from({ length: 7 }, (_, i) => { const d = new Date(s); d.setDate(s.getDate() + i); return d; });
    }

    // Side-by-side columns for overlapping blocks.
    function planLayout(list) {
      const items = list.slice().sort((a, b) => planApptStart(a) - planApptStart(b) || planApptDur(b) - planApptDur(a));
      const pos = {};
      let cluster = [], clusterEnd = 0;
      function flush() {
        const cols = [];
        cluster.forEach(a => {
          const s = planApptStart(a), e = s + planApptDur(a);
          let placed = false;
          for (let i = 0; i < cols.length; i++) {
            if (cols[i] <= s) { cols[i] = e; pos[a.id] = { c: i }; placed = true; break; }
          }
          if (!placed) { pos[a.id] = { c: cols.length }; cols.push(e); }
        });
        cluster.forEach(a => { pos[a.id].n = cols.length; });
        cluster = [];
      }
      items.forEach(a => {
        const s = planApptStart(a), e = s + planApptDur(a);
        if (cluster.length && s >= clusterEnd) flush();
        clusterEnd = cluster.length ? Math.max(clusterEnd, e) : e;
        cluster.push(a);
      });
      if (cluster.length) flush();
      return pos;
    }

    // Repeating habits that have a time, as calendar items for one day. Number
    // habits (values, not ticks) and the Prayers habit are left off.
    function planHabitsFor(d) {
      const k    = dateKey(d);
      const dow  = d.getDay();
      const comp = state.completionsByDate[k] || {};
      return state.habits
        .filter(h =>
          h.time && !h.archived && h.type !== 'number' && h.id !== state.prayerHabitId && habitActiveOn(h, d) && (
            h.frequency === 'daily' ||
            (h.frequency === 'weekly'  && h.days && h.days.includes(dow)) ||
            (h.frequency === 'monthly' && isMonthlyHabitDueToday(h, d))
          ))
        .map(h => ({
          id: 'habit:' + h.id, __habit: h.id, title: h.name,
          time: h.time, duration_min: h.duration_min || 30,
          completed: comp[h.id] === true || comp[h.id] === 'true',
        }));
    }

    function renderPlanColumn(d, todayKey, week) {
      const k    = dateKey(d);
      const isT  = k === todayKey;
      const wk   = d.getDay() >= 5;
      const H    = 24 * 60 * PLAN_PX;
      const list = (state.appointmentsByDate[k] || []).filter(a => planApptStart(a) !== null).concat(planHabitsFor(d));
      const lay  = planLayout(list);

      let lines = '';
      for (let h = 0; h < 24; h++) {
        lines += `<div style="position:absolute;left:0;right:0;top:${h * 60 * PLAN_PX}px;border-top:1px solid #24231f;"></div>`;
        lines += `<div style="position:absolute;left:0;right:0;top:${(h * 60 + 30) * PLAN_PX}px;border-top:1px dotted #1a1916;"></div>`;
      }

      const blocks = list.map(a => {
        const s     = planApptStart(a), dur = planApptDur(a);
        const p     = lay[a.id] || { c: 0, n: 1 }, w = 100 / p.n;
        const done  = !!a.completed;
        const isH   = !!a.__habit;
        const top   = s * PLAN_PX, ht = Math.max(dur * PLAN_PX, 22);
        const short = dur <= 30;
        const open   = isH ? `planHabitClick('${a.__habit}','${k}')`  : `planBlockClick('${a.id}','${k}')`;
        const toggle = isH ? `planHabitToggle('${a.__habit}','${k}')` : `planToggle('${a.id}','${k}')`;
        const wk     = !!a.is_work && !isH;
        const fill   = done ? '#141411' : isH ? 'rgba(245,241,237,0.06)' : wk ? 'rgba(91,155,213,0.20)' : 'rgba(217,119,87,0.18)';
        const edge   = done ? '#2a2925' : isH ? '#444441' : wk ? '#5b9bd5' : '#d97757';
        const bar    = done ? '#444441' : isH ? '#8a8985' : wk ? '#5b9bd5' : '#d97757';
        return `
          <div onclick="event.stopPropagation();${open}"
            style="position:absolute;top:${top}px;height:${ht}px;left:calc(${p.c * w}% + 2px);width:calc(${w}% - 4px);box-sizing:border-box;
              background:${fill};border:1px solid ${edge};border-left:3px solid ${bar};
              border-radius:3px;padding:2px 4px;overflow:hidden;cursor:pointer;z-index:2;display:flex;gap:5px;align-items:${short ? 'center' : 'flex-start'};">
            <button onclick="event.stopPropagation();${toggle}" aria-label="Mark done"
              style="flex:none;width:18px;height:18px;border-radius:3px;border:1px solid ${done ? (wk ? '#5b9bd5' : '#d97757') : '#8a8985'};background:${done ? (wk ? '#5b9bd5' : '#d97757') : 'transparent'};color:#0a0a0a;font-size:11px;line-height:1;font-weight:600;cursor:pointer;padding:0;">${done ? '✓' : ''}</button>
            <div style="min-width:0;font-size:11px;line-height:1.25;color:${done ? '#7a7570' : '#f5f1ed'};${done ? 'text-decoration:line-through;' : ''}">
              <div style="${short ? 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' : 'overflow-wrap:anywhere;'}">${isH ? '<span style="color:#8a8985;">↻</span> ' : ''}${escapeHtml(a.title)}</div>
              ${!short ? `<div style="font-size:9px;color:#8a8985;text-decoration:none;">${formatApptTime(a.time)}</div>` : ''}
            </div>
          </div>`;
      }).join('');

      let now = '';
      if (isT) {
        const n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
        now = `<div style="position:absolute;left:0;right:0;top:${nm * PLAN_PX}px;border-top:1px solid #d97757;z-index:3;pointer-events:none;">
                 <div style="position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:#d97757;"></div></div>`;
      }

      const bg = isT ? 'rgba(217,119,87,0.05)' : wk ? '#0e0e0c' : 'transparent';
      const offBg = 'rgba(245,241,237,0.02)';
      const off = wk ? '' :
        `<div data-off="before" style="position:absolute;left:0;right:0;top:0;height:${PLAN_WORK.start * PLAN_PX}px;background:${offBg};pointer-events:none;"></div>` +
        `<div data-off="after" style="position:absolute;left:0;right:0;top:${PLAN_WORK.end * PLAN_PX}px;bottom:0;background:${offBg};pointer-events:none;"></div>`;
      return `<div data-day="${k}" onclick="planGridClick(event,'${k}')"
        style="position:relative;height:${H}px;border-left:1px solid #2a2925;cursor:cell;background:${bg};">${off}${lines}${blocks}${now}</div>`;
    }

    function renderPlanView() {
      const week     = true;
      const days     = planDays();
      const todayKey = dateKey(new Date());
      const H        = 24 * 60 * PLAN_PX;
      const grid     = `44px repeat(${days.length},${week ? 'minmax(84px,1fr)' : 'minmax(0,1fr)'})`;
      const dayShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      // Sticky header: day names (week only) and appointments without a time.
      const anyUntimed = days.some(d => (state.appointmentsByDate[dateKey(d)] || []).some(a => planApptStart(a) === null));
      let head = `<div style="display:grid;grid-template-columns:${grid};position:sticky;top:0;z-index:5;background:#0a0a0a;border-bottom:1px solid #2a2925;">
        <div style="font-size:8px;color:#5a5955;padding:7px 6px 0 0;text-align:right;">${anyUntimed ? 'any time' : ''}</div>`;
      days.forEach(d => {
        const k   = dateKey(d);
        const isT = k === todayKey;
        const wk  = d.getDay() >= 5;
        const untimed = (state.appointmentsByDate[k] || []).filter(a => planApptStart(a) === null);
        const label = `<div style="padding:5px 0 3px;text-align:center;font-size:10px;color:${isT ? '#d97757' : '#8a8985'};">${dayShort[d.getDay()]} <b style="font-size:12px;font-weight:600;color:${isT ? '#d97757' : '#f5f1ed'};">${d.getDate()}</b></div>`;
        const chips = untimed.map(a => `
          <button onclick="planBlockClick('${a.id}','${k}')"
            style="display:block;width:100%;text-align:left;margin:2px 0 0;padding:3px 5px;font-size:10px;font-family:inherit;border-radius:3px;border:1px solid ${a.is_work ? '#5b9bd5' : '#2a2925'};background:${a.is_work ? 'rgba(91,155,213,0.15)' : '#141411'};color:${a.completed ? '#7a7570' : '#f5f1ed'};${a.completed ? 'text-decoration:line-through;' : ''}cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.title)}</button>`).join('');
        head += `<div style="border-left:1px solid #2a2925;padding:0 2px ${untimed.length ? 4 : 0}px;${wk ? 'background:#0e0e0c;' : ''}">${label}${chips}</div>`;
      });
      head += `</div>`;

      let labels = '';
      for (let h = 1; h < 24; h++) {
        labels += `<div style="position:absolute;right:6px;top:${h * 60 * PLAN_PX}px;transform:translateY(-50%);font-size:9px;color:#7a7570;white-space:nowrap;">${planHourLabel(h)}</div>`;
      }
      const body = `<div style="display:grid;grid-template-columns:${grid};">
        <div style="position:relative;height:${H}px;">${labels}</div>
        ${days.map(d => renderPlanColumn(d, todayKey, week)).join('')}
      </div>`;

      return `
        <div id="plan-scroll" style="overflow:auto;height:60vh;border:1px solid #2a2925;border-radius:6px;background:#0a0a0a;-webkit-overflow-scrolling:touch;">
          <div style="min-width:${week ? 680 : 0}px;">${head}${body}</div>
        </div>`;
    }

    // Called at the end of render(): fill the screen, then restore the scroll
    // position (or jump to about an hour before now).
    function planAfterRender() {
      const sc = document.getElementById('plan-scroll');
      if (!sc) return;
      sc.style.height = Math.max(240, window.innerHeight - sc.getBoundingClientRect().top - 16) + 'px';
      if (state.planScroll === null) {
        const keys = planDays().map(dateKey);
        const n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
        const focus = keys.includes(dateKey(n)) ? nm - 60 : 7 * 60;
        sc.scrollTop = Math.max(0, focus * PLAN_PX);
        state.planScroll = sc.scrollTop;
      } else {
        sc.scrollTop = state.planScroll;
      }
    }

    function planGridClick(e, k) {
      const y = e.clientY - e.currentTarget.getBoundingClientRect().top;
      let m = Math.floor(y / PLAN_PX / 30) * 30;
      m = Math.max(0, Math.min(m, 24 * 60 - 30));
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      state.quickAddDefaults = { date: k, time: `${hh}:${mm}` };
      state.quickAddOpen = true;
      render();
    }

    // Past days stay read-only for editing, matching the Today list.
    function planBlockClick(id, k) {
      const [y, m, d] = k.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      if (isPastDate(date)) return;
      state.selectedDate = date;
      openAppointmentForm(id);
    }

    async function planToggle(id, k) {
      const a = (state.appointmentsByDate[k] || []).find(x => x.id === id);
      if (!a) return;
      a.completed = !a.completed;
      render();
      await db.from('appointments').update({ completed: a.completed }).eq('id', id);
      state.allAppointments = null;
    }

    // Habit blocks: tick for that day (same completions as the Today tab).
    // Future days can't be ticked ahead of time.
    function planHabitToggle(habitId, k) {
      const [y, m, d] = k.split('-').map(Number);
      if (isFutureDate(new Date(y, m - 1, d))) return;
      const cur  = (state.completionsByDate[k] || {})[habitId];
      const next = !(cur === true || cur === 'true');
      if (!state.completionsByDate[k]) state.completionsByDate[k] = {};
      state.completionsByDate[k][habitId] = next;
      render();
      upsertCompletion(habitId, k, next);
    }

    function planHabitClick(habitId) {
      state.planHabitSheet = { id: habitId };
      render();
    }

    function closePlanHabitSheet() {
      state.planHabitSheet = null;
      render();
    }

    async function writeHabitTime(time, duration) {
      const sheet = state.planHabitSheet;
      const h = sheet && state.habits.find(x => x.id === sheet.id);
      if (!h) return;
      const patch = { time: time || null, duration_min: time ? duration : null };
      const { error } = await db.from('habits').update(patch).eq('id', h.id);
      if (error) { alert('Could not save: ' + error.message + '. Run the habit time migration first.'); return; }
      h.time = patch.time; h.duration_min = patch.duration_min;
      state.planHabitSheet = null;
      render();
    }

    function savePlanHabit(formEl) {
      return writeHabitTime(formEl.time.value.trim(), parseInt(formEl.duration.value, 10) || 30);
    }

    function removePlanHabitTime() {
      return writeHabitTime(null, null);
    }

    function renderPlanHabitSheet() {
      const sheet = state.planHabitSheet;
      const h = sheet && state.habits.find(x => x.id === sheet.id);
      if (!h) return '';
      const inputStyle = 'width:100%;background:#0a0a0a;border:1px solid #2a2925;color:#f5f1ed;border-radius:4px;padding:9px 10px;font-size:12px;font-family:inherit;outline:none;';
      const repeats = h.frequency === 'weekly' && h.days
        ? 'Repeats ' + h.days.map(d => dayNames[d].slice(0, 3)).join(', ')
        : 'Repeats ' + h.frequency;
      return `
        <div onclick="closePlanHabitSheet()"
          style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;">
          <div onclick="event.stopPropagation()"
            style="background:#141411;border:1px solid #2a2925;border-top-left-radius:10px;border-top-right-radius:10px;padding:16px;width:100%;max-width:480px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;">Habit time</p>
            <p style="color:#f5f1ed;font-size:13px;margin-bottom:2px;">${escapeHtml(h.name)}</p>
            <p style="color:#7a7570;font-size:10px;margin-bottom:12px;">${escapeHtml(repeats)}. Shows on the Plan calendar on those days.</p>
            <form onsubmit="event.preventDefault();savePlanHabit(this);" style="display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;gap:8px;">
                <input name="time" type="time" required value="${h.time || ''}" style="${inputStyle};flex:1;">
                ${planDurationSelect(h.duration_min || 30, inputStyle + 'flex:1;')}
              </div>
              <div style="display:flex;gap:8px;">
                <button type="submit" style="flex:1;background:#d97757;border:none;color:#0a0a0a;border-radius:4px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;">Save</button>
                <button type="button" onclick="closePlanHabitSheet()" style="flex:1;background:none;border:1px solid #2a2925;color:#8a8985;border-radius:4px;padding:9px;font-size:12px;cursor:pointer;">Cancel</button>
              </div>
              <button type="button" onclick="removePlanHabitTime()" style="background:none;border:none;color:#7a7570;font-size:10px;cursor:pointer;padding:6px 0;text-align:center;">Remove from calendar</button>
            </form>
          </div>
        </div>`;
    }

    async function planToday() {
      state.selectedDate = new Date();
      state.planScroll = null;
      await loadTabData();
      render();
    }

    // Keeps a Plan tab left open on an iPad current: refreshes from the
    // server each minute, rolls over at midnight, and scrolls back to "now"
    // after five idle minutes.
    function startPlanTicker() {
      const touch = () => { state.planLastTouch = Date.now(); };
      document.addEventListener('pointerdown', touch, { passive: true });
      document.addEventListener('scroll', touch, true);
      let resizeTimer = null;
      const refit = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.activeTab === 'plan' && !state.quickAddOpen && !state.appointmentFormOpen && !state.planHabitSheet) render();
        }, 150);
      };
      window.addEventListener('resize', refit);
      window.addEventListener('orientationchange', refit);
      let lastDay = dateKey(new Date());
      setInterval(async () => {
        if (state.activeTab !== 'plan' || state.quickAddOpen || state.appointmentFormOpen || state.calendarOpen || state.planHabitSheet) return;
        try {
          const nowKey = dateKey(new Date());
          if (nowKey !== lastDay) {
            if (dateKey(state.selectedDate) === lastDay) state.selectedDate = new Date();
            lastDay = nowKey;
            state.planScroll = null;
          } else if (Date.now() - state.planLastTouch > 5 * 60 * 1000) {
            state.selectedDate = new Date();
            state.planScroll = null;
            state.planLastTouch = Date.now();
          }
          planDays().forEach(d => { state.appointmentsByDate[dateKey(d)] = undefined; });
          await loadTabData();
          render();
        } catch (e) { console.warn('Plan refresh failed', e); }
      }, 60000);
    }

    // ─── Main render ──────────────────────────────────────────────────────────────

    function render() {
      // Remember where the Plan grid was scrolled before the DOM is rebuilt.
      const planEl = document.getElementById('plan-scroll');
      if (planEl && state.planScroll !== null) state.planScroll = planEl.scrollTop;

      // Prayer tab only visible if user has a Prayers habit
      if (state.activeTab === 'prayer' && !state.prayerHabitId) state.activeTab = 'daily';

      // Tab groups with | dividers
      const tabLabels = { daily:'Today', plan:'Plan', prayer:'Prayers', weekly:'Week', monthly:'Month', year:'Year', notes:'Notes', appointments:'Appts' };
      const groups = [
        ['daily', 'plan', 'prayer'].filter(t => t !== 'prayer' || !!state.prayerHabitId),
        ['weekly', 'monthly', 'year'],
        ['notes', 'appointments'],
      ];

      function renderTabGroup(tabs) {
        return tabs.map(tab => {
          const active = state.activeTab === tab;
          return `<button onclick="setActiveTab('${tab}')"
            style="padding:6px 6px;font-size:11px;background:none;border:none;border-bottom:${active?'2px solid #d97757':'2px solid transparent'};cursor:pointer;color:${active?'#f5f1ed':'#7a7570'};white-space:nowrap;">
            ${tabLabels[tab]}
          </button>`;
        }).join('');
      }
      const tabGroupAligns = ['flex-start', 'center', 'flex-end'];
      const tabGroupDivs = groups.map((group, gi) =>
        `<div style="display:flex;align-items:center;justify-content:${tabGroupAligns[gi]};flex:1;">${renderTabGroup(group)}</div>`
      );
      const tabPipe = `<span style="color:#3a3530;font-size:13px;align-self:center;flex-shrink:0;">|</span>`;

      // Date nav bar
      let dateNavHtml = '';
      const tab = state.activeTab;

      if (tab === 'monthly') {
        const label = `${monthNames[state.selectedDate.getMonth()]} ${state.selectedDate.getFullYear()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeMonth(-1)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
            <button onclick="changeMonth(1)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      } else if (tab === 'weekly') {
        const dow  = state.selectedDate.getDay();
        const s    = new Date(state.selectedDate); s.setDate(s.getDate() - dow);
        const e    = new Date(s); e.setDate(s.getDate() + 6);
        const label = `${monthNames[s.getMonth()]} ${s.getDate()} – ${monthNames[e.getMonth()]} ${e.getDate()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeDate(-7)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
            <button onclick="changeDate(7)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      } else if (tab === 'year') {
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeYear(-1)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${state.selectedDate.getFullYear()}</p>
            <button onclick="changeYear(1)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      } else if (tab === 'plan') {
        const ps = new Date(state.selectedDate); ps.setDate(ps.getDate() - ps.getDay());
        const pe = new Date(ps); pe.setDate(ps.getDate() + 6);
        const plabel = ps.getMonth() === pe.getMonth()
          ? `${monthShort[ps.getMonth()]} ${ps.getDate()} – ${pe.getDate()}`
          : `${monthShort[ps.getMonth()]} ${ps.getDate()} – ${monthShort[pe.getMonth()]} ${pe.getDate()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeDate(-7)" aria-label="Previous week" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 14px;">‹</button>
            <button onclick="planToday()" title="Back to this week" style="background:none;border:none;cursor:pointer;padding:6px 12px;">
              <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${plabel}</p>
            </button>
            <button onclick="changeDate(7)" aria-label="Next week" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 14px;">›</button>
          </div>`;
      } else if (tab === 'notes' || tab === 'appointments') {
        dateNavHtml = ''; // no date nav for notes / appointments list
      } else {
        // daily / prayer — tappable date label opens mini-calendar
