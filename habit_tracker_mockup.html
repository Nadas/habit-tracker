<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f1ed;
      touch-action: manipulation;
    }
    .container { min-height: 100vh; background: #0a0a0a; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#7a7570;font-size:12px;">Loading…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    function dateKey(date) {
      return date.toISOString().split('T')[0];
    }

    const PRAYER_KEYS    = ['fajr','dhuhr','asr','maghrib','isha'];
    const PRAYER_DEFAULT = { fajr:false, dhuhr:false, asr:false, maghrib:false, isha:false, menstruating:false };

    let state = {
      activeTab: 'daily',
      selectedDate: new Date(),
      habits: [],               // habit rows from DB
      completionsByDate: {},    // { 'YYYY-MM-DD': { habitId: value } }
      prayersByDate: {},        // { 'YYYY-MM-DD': { fajr, dhuhr, ... menstruating } }
      dailyNotes: {},           // { 'YYYY-MM-DD': string }
      prayerHabitId: null,
      weightHabitId: null,
      weightData: {},           // { 'YYYY-MM-DD': number } for stats
    };

    const dayNames   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // ─── Helpers ───────────────────────────────────────────────────────────────

    function getCompletions(date) {
      return state.completionsByDate[dateKey(date)] || {};
    }

    function getPrayers(date) {
      return state.prayersByDate[dateKey(date)] || { ...PRAYER_DEFAULT };
    }

    function isFutureDate(date) {
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(date); d.setHours(0,0,0,0);
      return d > today;
    }

    function getHabitValue(habitId, date) {
      if (isFutureDate(date)) {
        const h = state.habits.find(h => h.id === habitId);
        if (!h) return false;
        if (h.type === 'number') return h.unit === 'am' ? '00:00' : null;
        return false;
      }
      const v = getCompletions(date)[habitId];
      return v === undefined ? false : v;
    }

    // Returns { dot, text } for a prayer state
    function prayerStatus(prayers, future) {
      if (future) return { dot:'#444441', text:'Incomplete' };
      if (prayers.menstruating) return { dot:'#7a3535', text:'Menstruating' };
      if (PRAYER_KEYS.every(k => prayers[k])) return { dot:'#d97757', text:'Complete' };
      return { dot:'#444441', text:'Incomplete' };
    }

    // ─── Data loading ───────────────────────────────────────────────────────────

    function parseCompletionValue(val) {
      if (val === 'true')  return true;
      if (val === 'false') return false;
      return val;
    }

    async function loadCompletionsForDate(date) {
      const key = dateKey(date);
      if (state.completionsByDate[key] !== undefined) return;

      const { data } = await db.from('completions')
        .select('habit_id, value')
        .eq('user_id', currentUser.id)
        .eq('date', key);

      const completions = {};
      let prayers = { ...PRAYER_DEFAULT };

      (data || []).forEach(c => {
        if (c.habit_id === state.prayerHabitId) {
          try { prayers = { ...PRAYER_DEFAULT, ...JSON.parse(c.value) }; } catch(e) {}
        } else {
          completions[c.habit_id] = parseCompletionValue(c.value);
        }
      });

      state.completionsByDate[key] = completions;
      state.prayersByDate[key]     = prayers;
    }

    async function loadNoteForDate(date) {
      const key = dateKey(date);
      if (state.dailyNotes[key] !== undefined) return;

      const { data } = await db.from('daily_notes')
        .select('content')
        .eq('user_id', currentUser.id)
        .eq('date', key)
        .maybeSingle();

      state.dailyNotes[key] = data?.content || '';
    }

    async function loadCompletionsForRange(startDate, endDate) {
      const startKey = dateKey(startDate);
      const endKey   = dateKey(endDate);

      const { data } = await db.from('completions')
        .select('habit_id, date, value')
        .eq('user_id', currentUser.id)
        .gte('date', startKey)
        .lte('date', endKey);

      const byDate  = {};
      const prayers = {};

      (data || []).forEach(c => {
        if (!byDate[c.date])  byDate[c.date]  = {};
        if (!prayers[c.date]) prayers[c.date] = { ...PRAYER_DEFAULT };

        if (c.habit_id === state.prayerHabitId) {
          try { prayers[c.date] = { ...PRAYER_DEFAULT, ...JSON.parse(c.value) }; } catch(e) {}
        } else {
          byDate[c.date][c.habit_id] = parseCompletionValue(c.value);
        }
      });

      let d = new Date(startDate);
      while (d <= endDate) {
        const k = dateKey(d);
        state.completionsByDate[k] = byDate[k]  || {};
        state.prayersByDate[k]     = prayers[k] || { ...PRAYER_DEFAULT };
        d.setDate(d.getDate() + 1);
      }
    }

    async function loadWeightForMonth(year, month) {
      if (!state.weightHabitId) return;
      const startKey = `${year}-${String(month+1).padStart(2,'0')}-01`;
      const endKey   = `${year}-${String(month+1).padStart(2,'0')}-31`;

      const { data } = await db.from('completions')
        .select('date, value')
        .eq('habit_id', state.weightHabitId)
        .gte('date', startKey)
        .lte('date', endKey)
        .order('date');

      state.weightData = {};
      (data || []).forEach(c => {
        const val = parseFloat(c.value);
        if (!isNaN(val)) state.weightData[c.date] = val;
      });
    }

    // ─── Mutations ──────────────────────────────────────────────────────────────

    async function setHabit(habitId, value) {
      const key = dateKey(state.selectedDate);
      if (!state.completionsByDate[key]) state.completionsByDate[key] = {};
      state.completionsByDate[key][habitId] = value;
      render();

      const valueStr = value === true ? 'true' : value === false ? 'false' : String(value ?? '');
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: habitId, date: key, value: valueStr },
        { onConflict: 'habit_id,date' }
      );
    }

    async function togglePrayer(prayerId) {
      const key = dateKey(state.selectedDate);
      if (!state.prayersByDate[key]) state.prayersByDate[key] = { ...PRAYER_DEFAULT };
      state.prayersByDate[key][prayerId] = !state.prayersByDate[key][prayerId];
      render();

      if (!state.prayerHabitId) return;
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: state.prayerHabitId, date: key, value: JSON.stringify(state.prayersByDate[key]) },
        { onConflict: 'habit_id,date' }
      );
    }

    async function toggleMenstruating() {
      const key = dateKey(state.selectedDate);
      if (!state.prayersByDate[key]) state.prayersByDate[key] = { ...PRAYER_DEFAULT };
      state.prayersByDate[key].menstruating = !state.prayersByDate[key].menstruating;
      render();

      if (!state.prayerHabitId) return;
      await db.from('completions').upsert(
        { user_id: currentUser.id, habit_id: state.prayerHabitId, date: key, value: JSON.stringify(state.prayersByDate[key]) },
        { onConflict: 'habit_id,date' }
      );
    }

    async function saveNote(value) {
      const key = dateKey(state.selectedDate);
      state.dailyNotes[key] = value;
      await db.from('daily_notes').upsert(
        { user_id: currentUser.id, date: key, content: value },
        { onConflict: 'user_id,date' }
      );
    }

    // ─── Navigation ─────────────────────────────────────────────────────────────

    async function setActiveTab(tab) {
      state.activeTab = tab;
      await loadTabData();
      render();
    }

    async function changeDate(days) {
      const d = new Date(state.selectedDate);
      d.setDate(d.getDate() + days);
      state.selectedDate = d;
      await loadTabData();
      render();
    }

    async function changeMonth(months) {
      const d = new Date(state.selectedDate);
      d.setMonth(d.getMonth() + months);
      state.selectedDate = d;
      await loadTabData();
      render();
    }

    async function goToToday() {
      state.selectedDate = new Date();
      state.activeTab = 'daily';
      await loadTabData();
      render();
    }

    function goToSettings() { window.location.href = 'habit_tracker_manage_habits_mockup.html'; }
    function goToProfile()  { window.location.href = 'habit_tracker_profile.html'; }

    async function loadTabData() {
      const tab  = state.activeTab;
      const date = state.selectedDate;

      if (tab === 'daily' || tab === 'prayer') {
        await Promise.all([loadCompletionsForDate(date), loadNoteForDate(date)]);
      } else if (tab === 'weekly') {
        const dow   = date.getDay();
        const start = new Date(date); start.setDate(date.getDate() - dow);
        const end   = new Date(start); end.setDate(start.getDate() + 6);
        await loadCompletionsForRange(start, end);
      } else if (tab === 'monthly') {
        const start = new Date(date.getFullYear(), date.getMonth(), 1);
        const end   = new Date(date.getFullYear(), date.getMonth() + 1, 0);
        await loadCompletionsForRange(start, end);
      } else if (tab === 'stats') {
        await loadWeightForMonth(date.getFullYear(), date.getMonth());
      }
    }

    // ─── Render helpers ─────────────────────────────────────────────────────────

    function renderHabitItem(habit) {
      const value = getHabitValue(habit.id, state.selectedDate);

      if (habit.type === 'number') {
        const suffix      = habit.unit || '';
        const placeholder = habit.unit === 'am' ? '00:00' : '0.0';
        return `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${habit.name}</p></div>
            <input type="text" value="${value || ''}"
              onchange="setHabit('${habit.id}', this.value)"
              placeholder="${placeholder}"
              style="width:60px;text-align:right;background:#0a0a0a;border:1px solid #2a2925;color:#f5f1ed;padding:5px 8px;border-radius:4px;font-size:12px;outline:none;" />
            <span style="color:#8a8985;font-size:11px;">${suffix}</span>
          </div>`;
      }

      return `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
          <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${habit.name}</p></div>
          <button onclick="setHabit('${habit.id}',false)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${!value?'#2a2925':'#141411'};color:#8a8985;cursor:pointer;font-size:14px;">✕</button>
          <button onclick="setHabit('${habit.id}',true)"
            style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${value?'#d97757':'#141411'};color:${value?'#0a0a0a':'#8a8985'};cursor:pointer;font-weight:600;">✓</button>
        </div>`;
    }

    function renderSection(title, habits) {
      if (!habits.length) return '';
      return `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">${title}</p>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${habits.map(h => renderHabitItem(h)).join('')}
          </div>
        </div>`;
    }

    // Renders a single grid cell for weekly/monthly views
    function renderGridCell(h, k) {
      if (h.id === state.prayerHabitId) {
        const dp = state.prayersByDate[k] || {};
        let bg = '#2a2925', op = 0.4;
        if (dp.menstruating) { bg = '#7a3535'; op = 1; }
        else if (PRAYER_KEYS.every(pk => dp[pk])) { bg = '#d97757'; op = 1; }
        return `<div style="width:10px;height:10px;border-radius:2px;background:${bg};opacity:${op};margin:0 auto;"></div>`;
      }
      const val  = (state.completionsByDate[k] || {})[h.id];
      const done = h.type === 'number'
        ? (val !== null && val !== undefined && val !== '' && val !== false && val !== 'false')
        : (val === true || val === 'true');
      return `<div style="width:10px;height:10px;border-radius:2px;background:${done?'#d97757':'#2a2925'};opacity:${done?1:0.4};margin:0 auto;"></div>`;
    }

    // ─── View renderers ──────────────────────────────────────────────────────────

    function renderDailyView() {
      const dow    = state.selectedDate.getDay();
      const key    = dateKey(state.selectedDate);
      const future = isFutureDate(state.selectedDate);

      // Exclude the prayer habit from morning/evening sections
      const morningHabits = state.habits.filter(h =>
        h.frequency === 'daily' && h.section === 'morning' && h.id !== state.prayerHabitId
      );
      const eveningHabits = [
        ...state.habits.filter(h =>
          h.frequency === 'daily' && h.section === 'evening' && h.id !== state.prayerHabitId
        ),
        ...state.habits.filter(h =>
          h.frequency === 'weekly' && h.days && h.days.includes(dow) && h.section === 'evening'
        ),
      ];
      const weeklyHabits = state.habits.filter(h =>
        h.frequency === 'weekly' && h.days && h.days.includes(dow) && !h.section
      );

      const prayers        = getPrayers(state.selectedDate);
      const status         = prayerStatus(prayers, future);
      const hasPrayerHabit = !!state.prayerHabitId;

      const prayerRow = hasPrayerHabit ? `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">Prayer</p>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">Prayers</p></div>
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:6px;height:6px;border-radius:50%;background:${status.dot};"></div>
              <span style="color:#8a8985;font-size:11px;">${status.text}</span>
            </div>
          </div>
        </div>` : '';

      const savedNote = state.dailyNotes[key] || '';
      const notesRow  = `
        <div>
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">Notes</p>
          <textarea onchange="saveNote(this.value)" placeholder="Add a note for today…"
            style="width:100%;background:#141411;border:1px solid #2a2925;color:#f5f1ed;border-radius:4px;padding:9px 12px;font-size:12px;font-family:inherit;resize:none;min-height:72px;outline:none;transition:border-color 0.2s;"
            onfocus="this.style.borderColor='#d97757'" onblur="this.style.borderColor='#2a2925'"
          >${savedNote}</textarea>
        </div>`;

      return `<div style="display:flex;flex-direction:column;gap:12px;">
        ${renderSection('Morning', morningHabits)}
        ${renderSection('Evening', eveningHabits)}
        ${prayerRow}
        ${weeklyHabits.length ? renderSection('Weekly', weeklyHabits) : ''}
        ${notesRow}
      </div>`;
    }

    function renderPrayerView() {
      const prayerList = [
        { id:'fajr',    label:'Fajr'    },
        { id:'dhuhr',   label:'Dhuhr'   },
        { id:'asr',     label:'Asr'     },
        { id:'maghrib', label:'Maghrib' },
        { id:'isha',    label:'Isha'    },
      ];
      const prayers       = getPrayers(state.selectedDate);
      const future        = isFutureDate(state.selectedDate);
      const isMenstruating = prayers.menstruating;
      const status        = prayerStatus(prayers, future);

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="margin-bottom:4px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">Status</p>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
              <div style="width:6px;height:6px;border-radius:50%;background:${status.dot};"></div>
              <p style="color:#f5f1ed;font-size:12px;font-weight:400;flex:1;">${status.text}</p>
            </div>
          </div>

          <div>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">Menstruating</p>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
              <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">No prayers required</p></div>
              <button onclick="toggleMenstruating()"
                style="width:40px;height:24px;border-radius:12px;border:none;background:${isMenstruating?'#7a3535':'#2a2925'};cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0;">
                <div style="position:absolute;width:20px;height:20px;background:#0a0a0a;border-radius:50%;top:2px;left:${isMenstruating?'18px':'2px'};transition:left 0.2s;"></div>
              </button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;${isMenstruating?'opacity:0.4;pointer-events:none;':''}">`;

      prayerList.forEach(p => {
        const done = !future && !isMenstruating && prayers[p.id];
        html += `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141411;border-radius:4px;border:1px solid #2a2925;">
            <div style="flex:1;"><p style="color:#f5f1ed;font-size:12px;font-weight:400;">${p.label}</p></div>
            <button onclick="togglePrayer('${p.id}')"
              style="width:28px;height:28px;border-radius:4px;border:1px solid #2a2925;background:${done?'#d97757':'#141411'};color:${done?'#0a0a0a':'#8a8985'};cursor:pointer;font-weight:600;">✓</button>
          </div>`;
      });

      html += `</div></div>`;
      return html;
    }

    function renderWeeklyView() {
      const dow         = state.selectedDate.getDay();
      const startOfWeek = new Date(state.selectedDate);
      startOfWeek.setDate(state.selectedDate.getDate() - dow);

      // Include prayer habit in grid (filtered when prayerHabitId exists)
      const gridHabits   = state.habits.filter(h => h.frequency === 'daily');
      const dayShortNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">
            Week of ${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()}
          </p>
          <div style="background:#141411;border-radius:6px;border:1px solid #2a2925;padding:8px;overflow-x:auto;">
            <table style="width:auto;border-collapse:collapse;font-size:10px;">
              <thead><tr><th style="width:28px;padding-right:4px;"></th>`;

      gridHabits.forEach(h => {
        html += `<th style="padding:4px 2px;width:24px;height:100px;">
          <p style="color:#f5f1ed;font-weight:400;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;">${h.name}</p>
        </th>`;
      });

      html += `</tr></thead><tbody>`;

      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i);
        const k = dateKey(d);

        html += `<tr style="border-top:1px solid #2a2925;">
          <td style="padding:3px 4px;text-align:right;color:#7a7570;font-size:9px;font-weight:600;">${dayShortNames[d.getDay()]}</td>`;

        gridHabits.forEach(h => {
          html += `<td style="padding:3px 2px;text-align:center;">${renderGridCell(h, k)}</td>`;
        });

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
      return html;
    }

    function renderMonthlyView() {
      const year        = state.selectedDate.getFullYear();
      const month       = state.selectedDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const gridHabits  = state.habits.filter(h => h.frequency === 'daily');

      let html = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">
            ${monthNames[month]} ${year}
          </p>
          <div style="background:#141411;border-radius:6px;border:1px solid #2a2925;padding:8px;overflow-x:auto;">
            <table style="width:auto;border-collapse:collapse;font-size:10px;">
              <thead><tr><th style="width:28px;padding-right:4px;"></th>`;

      gridHabits.forEach(h => {
        html += `<th style="padding:4px 2px;width:24px;height:100px;">
          <p style="color:#f5f1ed;font-weight:400;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;">${h.name}</p>
        </th>`;
      });

      html += `</tr></thead><tbody>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const k = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        html += `<tr style="border-top:1px solid #2a2925;">
          <td style="padding:3px 4px;text-align:right;color:#7a7570;font-size:9px;font-weight:600;">${day}</td>`;

        gridHabits.forEach(h => {
          html += `<td style="padding:3px 2px;text-align:center;">${renderGridCell(h, k)}</td>`;
        });

        html += `</tr>`;
      }

      html += `</tbody></table></div></div>`;
      return html;
    }

    function renderStatsView() {
      const year  = state.selectedDate.getFullYear();
      const month = state.selectedDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const monthData = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const k = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (state.weightData[k] !== undefined) {
          monthData.push({ date: String(d), weight: state.weightData[k] });
        }
      }

      if (monthData.length === 0) {
        return `<div style="text-align:center;padding:40px 20px;color:#7a7570;font-size:12px;">No weight data logged yet for ${monthNames[month]} ${year}.</div>`;
      }

      const weights       = monthData.map(d => d.weight);
      const startWeight   = weights[0];
      const currentWeight = weights[weights.length - 1];
      const goalWeight    = 63.0;
      const weightLost    = startWeight - currentWeight;
      const weightToGoal  = currentWeight - goalWeight;

      const chartWidth  = 420, chartHeight = 200;
      const pL = 40, pR = 20, pT = 20, pB = 40;
      const iW = chartWidth - pL - pR;
      const iH = chartHeight - pT - pB;

      const minW  = Math.min(...weights);
      const maxW  = Math.max(...weights);
      const range = maxW - minW || 1;

      let points = '';
      monthData.forEach((e, i) => {
        const x = pL + (i / (monthData.length - 1)) * iW;
        const y = pT + iH - ((e.weight - minW) / range) * iH;
        points += `${x},${y} `;
      });

      let yLines = '', yLabels = '';
      for (let i = 0; i <= 5; i++) {
        const val = minW + (range / 5) * i;
        const y   = pT + iH - (i / 5) * iH;
        yLines  += `<line x1="${pL}" y1="${y}" x2="${chartWidth-pR}" y2="${y}" stroke="#2a2925" stroke-width="0.5" opacity="0.5"/>`;
        yLabels += `<text x="${pL-6}" y="${y+3}" font-size="8" fill="#8a8985" text-anchor="end">${val.toFixed(1)}</text>`;
      }

      let xLabels = '';
      for (let i = 0; i < monthData.length; i += 5) {
        const x = pL + (i / (monthData.length - 1)) * iW;
        xLabels += `<text x="${x}" y="${pT+iH+16}" font-size="9" fill="#8a8985" text-anchor="middle">${monthData[i].date}</text>`;
      }
      const lastX = pL + iW;
      xLabels += `<text x="${lastX}" y="${pT+iH+16}" font-size="9" fill="#8a8985" text-anchor="middle">${monthData[monthData.length-1].date}</text>`;

      const dots = monthData.map((e, i) => {
        const x = pL + (i / (monthData.length - 1)) * iW;
        const y = pT + iH - ((e.weight - minW) / range) * iH;
        return `<circle cx="${x}" cy="${y}" r="1.5" fill="#d97757" opacity="0.8"/>`;
      }).join('');

      return `
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div style="display:flex;gap:12px;">
            <div style="flex:1;background:#141411;border:1px solid #2a2925;border-radius:6px;padding:16px;">
              <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;">Weight Lost</p>
              <p style="color:#f5f1ed;font-size:24px;font-weight:400;margin-bottom:4px;">${Math.abs(weightLost).toFixed(1)} kg</p>
              <div style="color:#8a8985;font-size:11px;">
                <div>Started: ${startWeight.toFixed(1)} kg</div>
                <div style="color:#d97757;margin-top:4px;">↓ ${((Math.abs(weightLost)/startWeight)*100).toFixed(1)}%</div>
              </div>
            </div>
            <div style="flex:1;background:#141411;border:1px solid #2a2925;border-radius:6px;padding:16px;">
              <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;">Current Weight</p>
              <p style="color:#f5f1ed;font-size:24px;font-weight:400;margin-bottom:4px;">${currentWeight.toFixed(1)} kg</p>
              <div style="color:#8a8985;font-size:11px;">
                <div>Goal: ${goalWeight.toFixed(1)} kg</div>
                <div style="margin-top:4px;">${Math.abs(weightToGoal).toFixed(1)} kg to go</div>
              </div>
            </div>
          </div>

          <div style="background:#141411;border:1px solid #2a2925;border-radius:6px;padding:16px;">
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:16px;">
              Weight Trend — ${monthNames[month]} ${year}
            </p>
            <svg viewBox="0 0 ${chartWidth} ${chartHeight}" style="width:100%;height:200px;">
              ${yLines}
              <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${pT+iH}" stroke="#8a8985" stroke-width="1"/>
              <line x1="${pL}" y1="${pT+iH}" x2="${chartWidth-pR}" y2="${pT+iH}" stroke="#8a8985" stroke-width="1"/>
              ${yLabels}
              ${xLabels}
              <polyline points="${points}" fill="none" stroke="#d97757" stroke-width="2" opacity="0.9"/>
              ${dots}
            </svg>
          </div>
        </div>`;
    }

    // ─── Main render ─────────────────────────────────────────────────────────────

    function render() {
      // Prayer tab only visible if user has a Prayers habit
      const allTabs   = ['daily','prayer','weekly','monthly','stats'];
      const tabs      = allTabs.filter(t => t !== 'prayer' || !!state.prayerHabitId);
      const tabLabels = { daily:'Today', prayer:'Prayers', weekly:'Week', monthly:'Month', stats:'Stats' };

      // If prayer tab was active but habit was removed, fall back to daily
      if (state.activeTab === 'prayer' && !state.prayerHabitId) state.activeTab = 'daily';

      let tabNav = '';
      tabs.forEach(tab => {
        const active  = state.activeTab === tab;
        const color   = active ? '#f5f1ed' : '#7a7570';
        const border  = active ? '2px solid #d97757' : '2px solid transparent';
        const margin  = tab === 'stats' ? 'margin-left:auto;' : '';
        tabNav += `
          <button onclick="setActiveTab('${tab}')"
            style="padding:6px 0;font-size:11px;background:none;border:none;border-bottom:${border};cursor:pointer;color:${color};${margin}">
            ${tabLabels[tab]}
          </button>`;
      });

      // Date nav bar
      let dateNavHtml = '';
      if (state.activeTab === 'stats' || state.activeTab === 'monthly') {
        const label = `${monthNames[state.selectedDate.getMonth()]} ${state.selectedDate.getFullYear()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeMonth(-1)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
            <button onclick="changeMonth(1)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      } else if (state.activeTab === 'weekly') {
        const dow  = state.selectedDate.getDay();
        const s    = new Date(state.selectedDate); s.setDate(s.getDate() - dow);
        const e    = new Date(s); e.setDate(s.getDate() + 6);
        const label = `${monthNames[s.getMonth()]} ${s.getDate()} – ${monthNames[e.getMonth()]} ${e.getDate()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeDate(-7)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
            <button onclick="changeDate(7)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      } else {
        const isToday = new Date().toDateString() === state.selectedDate.toDateString();
        const label   = isToday
          ? 'Today'
          : `${dayNames[state.selectedDate.getDay()]}, ${monthNames[state.selectedDate.getMonth()]} ${state.selectedDate.getDate()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeDate(-1)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
            <button onclick="changeDate(1)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      }

      let content = '';
      if      (state.activeTab === 'daily')   content = renderDailyView();
      else if (state.activeTab === 'prayer')  content = renderPrayerView();
      else if (state.activeTab === 'weekly')  content = renderWeeklyView();
      else if (state.activeTab === 'monthly') content = renderMonthlyView();
      else if (state.activeTab === 'stats')   content = renderStatsView();

      document.getElementById('root').innerHTML = `
        <div class="container">
          <div style="position:sticky;top:0;background:#0a0a0a;border-bottom:1px solid #2a2925;z-index:10;">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2a2925;">
              <button onclick="goToProfile()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </button>
              <h1 onclick="goToToday()" style="font-size:14px;font-weight:400;margin:0;cursor:pointer;">Discipline</h1>
              <button onclick="goToSettings()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                  <circle cx="8" cy="6" r="2" fill="#0a0a0a"/><circle cx="16" cy="12" r="2" fill="#0a0a0a"/><circle cx="10" cy="18" r="2" fill="#0a0a0a"/>
                </svg>
              </button>
            </div>
            ${dateNavHtml}
            <div style="display:flex;gap:14px;border-bottom:1px solid #2a2925;padding:0 14px;align-items:center;">
              ${tabNav}
            </div>
          </div>
          <div style="padding:12px 14px;max-width:480px;margin:0 auto;">
            ${content}
          </div>
        </div>`;
    }

    // ─── Boot ────────────────────────────────────────────────────────────────────

    async function initApp() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = 'habit_tracker_login.html';
        return;
      }
      currentUser = session.user;

      const { data: habits } = await db.from('habits')
        .select('*')
        .eq('archived', false)
        .order('sort_order');

      state.habits = habits || [];

      // Identify special habit IDs
      state.prayerHabitId = state.habits.find(h => h.name === 'Prayers')?.id || null;
      // Weight habit: number type with kg unit or "weight" in name
      state.weightHabitId = state.habits.find(h =>
        h.type === 'number' && (h.unit === 'kg' || h.name.toLowerCase().includes('weight'))
      )?.id || null;

      await loadTabData();
      render();
    }

    initApp();
  </script>
</body>
</html>
