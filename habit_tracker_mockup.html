        const isToday = new Date().toDateString() === state.selectedDate.toDateString();
        const label   = isToday
          ? 'Today'
          : `${dayNames[state.selectedDate.getDay()]}, ${monthNames[state.selectedDate.getMonth()]} ${state.selectedDate.getDate()}`;
        dateNavHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2925;">
            <button onclick="changeDate(-1)" style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">‹</button>
            <button onclick="toggleCalendar()"
              style="background:none;border:none;cursor:pointer;padding:4px 8px;display:flex;align-items:center;gap:5px;">
              <p style="color:#8a8985;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">${label}</p>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5a5955" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </button>
            <button onclick="changeDate(1)"  style="background:none;border:none;color:#8a8985;cursor:pointer;font-size:18px;padding:4px 8px;">›</button>
          </div>`;
      }

      const contentMax = tab === 'plan' ? 'none' : !isWide() ? '480px' : tab === 'prayer' ? '560px' : tab === 'daily' ? '960px' : '1100px';

      let content = '';
      if      (tab === 'daily')   content = renderDailyView();
      else if (tab === 'prayer')  content = renderPrayerView();
      else if (tab === 'weekly')  content = renderWeeklyView();
      else if (tab === 'monthly') content = renderMonthlyView();
      else if (tab === 'year')    content = renderYearView();
      else if (tab === 'notes')   content = renderNotesView();
      else if (tab === 'plan')    content = renderPlanView();
      else if (tab === 'appointments') content = renderAppointmentsTabView();

      const defaultHeader = `
          <div style="position:sticky;top:0;background:#0a0a0a;border-bottom:1px solid #2a2925;z-index:10;">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2a2925;">
              <button onclick="goToProfile()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </button>
              <h1 onclick="goToToday()" style="font-size:14px;font-weight:400;margin:0;cursor:pointer;">Discipline</h1>
              <button onclick="goToSettings()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                  <circle cx="8" cy="6" r="2" fill="#0a0a0a"/><circle cx="16" cy="12" r="2" fill="#0a0a0a"/><circle cx="10" cy="18" r="2" fill="#0a0a0a"/>
                </svg>
              </button>
            </div>
            ${dateNavHtml}
            <div style="display:flex;border-bottom:1px solid #2a2925;padding:0 10px;align-items:stretch;">
              ${tabGroupDivs[0]}${tabPipe}${tabGroupDivs[1]}${tabPipe}${tabGroupDivs[2]}
            </div>
          </div>
      `;

      // Wide screens (iPad): Plan drops the title row and puts the profile
      // and settings icons on the tab row, so the header is two slim rows.
      const profileBtn  = `<button onclick="goToProfile()" aria-label="Profile" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>`;
      const settingsBtn = `<button onclick="goToSettings()" aria-label="Manage habits" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="6" r="2" fill="#0a0a0a"/><circle cx="16" cy="12" r="2" fill="#0a0a0a"/><circle cx="10" cy="18" r="2" fill="#0a0a0a"/></svg></button>`;
      const compactPlan = window.innerWidth >= 700;
      if (compactPlan) dateNavHtml = dateNavHtml.split('padding:10px 14px').join('padding:2px 14px');
      const headerHtml = compactPlan ? `
          <div style="position:sticky;top:0;background:#0a0a0a;border-bottom:1px solid #2a2925;z-index:10;">
            <div style="display:flex;align-items:center;padding:0 6px;border-bottom:1px solid #2a2925;">
              ${profileBtn}
              <div style="display:flex;flex:1;align-items:stretch;padding:0 6px;">${tabGroupDivs[0]}${tabPipe}${tabGroupDivs[1]}${tabPipe}${tabGroupDivs[2]}</div>
              ${settingsBtn}
            </div>
            ${dateNavHtml}
          </div>` : defaultHeader;

      document.getElementById('root').innerHTML = `
        ${renderCalendarOverlay()}
        ${renderQuickAddModal()}
        ${renderAppointmentEditModal()}
        ${renderPlanHabitSheet()}
        <div class="container">
          ${headerHtml}
          <div style="padding:12px 14px;max-width:${contentMax};margin:0 auto;">
            ${content}
          </div>
          ${tab === 'plan' ? '' : `<button onclick="toggleQuickAdd()" title="Add appointment"
            style="position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#d97757;border:none;color:#0a0a0a;font-size:22px;font-weight:400;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;line-height:1;z-index:40;">+</button>`}
        </div>`;
      if (tab === 'plan') planAfterRender();
    }

    // ─── Boot ─────────────────────────────────────────────────────────────────────

    async function initApp() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = 'habit_tracker_login.html';
        return;
      }
      currentUser = session.user;

      const { data: habits } = await db.from('habits')
        .select('*')
        .eq('user_id', currentUser.id)
        .eq('archived', false)
        .order('sort_order');

      // sort_order is assigned per frequency group (Daily/Weekly/Monthly/
      // Quarterly each start their own sequence), so two habits from
      // different groups can share the same sort_order value. A plain
      // `.order('sort_order')` has no tiebreaker for that case, which is
      // what produced inconsistent ordering in the Weekly/Monthly grids.
      // Group by frequency first (same order Manage Habits displays them
      // in), then by sort_order within each group, so ordering is fully
      // deterministic everywhere state.habits is used.
      const FREQUENCY_ORDER = { daily: 0, weekly: 1, monthly: 2, quarterly: 3 };
      state.habits = (habits || []).slice().sort((a, b) => {
        const fa = FREQUENCY_ORDER[a.frequency] ?? 99;
        const fb = FREQUENCY_ORDER[b.frequency] ?? 99;
        if (fa !== fb) return fa - fb;
        return (a.sort_order ?? 0) - (b.sort_order ?? 0);
      });

      state.prayerHabitId = state.habits.find(h => h.name === 'Prayers')?.id || null;

      await loadTabData();
      render();
      startPlanTicker();
    }

    initApp();
  </script>
</body>
