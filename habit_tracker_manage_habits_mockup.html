<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habit Tracker - Manage Habits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f1ed;
      touch-action: manipulation;
    }
    .container { min-height: 100vh; background: #0a0a0a; }
    .app-header {
      position: sticky; top: 0; background: #0a0a0a;
      border-bottom: 1px solid #2a2925; z-index: 10;
    }
    .app-header-top {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
      border-bottom: 1px solid #2a2925;
    }
    .app-header-top h1 { font-size: 14px; font-weight: 400; margin: 0; cursor: pointer; }
    .page-subheader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid #2a2925;
    }
    .page-subheader span { font-size: 12px; color: #8a8985; }
    .content { padding: 12px 14px; max-width: 480px; margin: 0 auto; }
    .section { margin-bottom: 20px; }
    .section-title {
      color: #8a8985; font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-count { background: #141411; padding: 2px 6px; border-radius: 3px; font-size: 9px; color: #7a7570; }
    .habit-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; background: #141411; border: 1px solid #2a2925;
      border-radius: 4px; margin-bottom: 6px; cursor: grab; transition: all 0.2s;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .habit-item.dragging { opacity: 0.4; }
    .habit-item.drag-over { border-color: #d97757; background: #1a1714; }
    .drag-handle { color: #7a7570; font-size: 14px; cursor: grab; flex-shrink: 0; padding: 4px; }
    .habit-info { flex: 1; min-width: 0; }
    .habit-name { color: #f5f1ed; font-size: 12px; font-weight: 400; margin-bottom: 4px; }
    .habit-meta { display: flex; gap: 8px; font-size: 9px; }
    .badge { background: #2a2925; color: #8a8985; padding: 2px 6px; border-radius: 3px; }
    .badge.freq-daily   { background: rgba(217,119,87,0.15); color: #d97757; }
    .badge.freq-weekly  { background: rgba(138,137,133,0.15); color: #8a8985; }
    .badge.freq-monthly { background: rgba(138,137,133,0.15); color: #8a8985; }
    .badge.freq-quarterly { background: rgba(138,137,133,0.15); color: #8a8985; }
    .habit-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .action-button {
      width: 28px; height: 28px; background: #2a2925; border: 1px solid #3a3530;
      border-radius: 4px; color: #8a8985; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .action-button:hover { background: #3a3530; color: #f5f1ed; }
    .action-button.delete:hover { background: #d97757; border-color: #d97757; color: #0a0a0a; }
    .empty-state { text-align: center; padding: 20px 10px; color: #7a7570; font-size: 12px; }
    .add-button {
      background: #d97757; color: #0a0a0a; border: none; padding: 10px 16px;
      border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;
      font-family: inherit; transition: opacity 0.2s;
    }
    .add-button:hover { opacity: 0.9; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 20; align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: #141411; border: 1px solid #2a2925; border-radius: 6px;
      padding: 16px; max-width: 400px; width: 90%;
    }
    .modal h3 { font-size: 13px; margin-bottom: 8px; }
    .modal p  { color: #8a8985; font-size: 12px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button {
      flex: 1; padding: 8px; border: none; border-radius: 4px;
      cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit;
    }
    .modal-actions .cancel  { background: #2a2925; color: #8a8985; }
    .modal-actions .confirm { background: #8a4a3a; color: #f5f1ed; }
    .loading-state { text-align: center; padding: 40px; color: #7a7570; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <div class="app-header-top">
        <button onclick="goToProfile()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
        <h1 onclick="goBack()">Discipline</h1>
        <button onclick="goBack()" style="background:none;border:none;color:#8a8985;cursor:pointer;padding:4px 8px;display:flex;align-items:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
            <circle cx="8" cy="6" r="2" fill="#0a0a0a"/><circle cx="16" cy="12" r="2" fill="#0a0a0a"/><circle cx="10" cy="18" r="2" fill="#0a0a0a"/>
          </svg>
        </button>
      </div>
      <div class="page-subheader">
        <span>Manage Habits</span>
        <button class="add-button" onclick="openAddHabit()">+ Add</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete Habit?</h3>
      <p id="deleteMsg">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="cancel"  onclick="closeDeleteModal()">Cancel</button>
        <button class="confirm" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let habits      = [];
    let deletingId  = null;
    let draggedId   = null;
    let touchClone  = null;
    let touchOffsetX = 0, touchOffsetY = 0;

    // ─── Init ─────────────────────────────────────────────────────────────────

    async function initApp() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'habit_tracker_login.html'; return; }
      currentUser = session.user;
      await loadHabits();
      render();
    }

    async function loadHabits() {
      const { data } = await db.from('habits')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('sort_order');
      habits = data || [];
    }

    // ─── Mutations ────────────────────────────────────────────────────────────

    async function archiveHabit(id) {
      const h = habits.find(h => h.id === id);
      if (!h) return;
      const newArchived = !h.archived;
      h.archived = newArchived;
      render();
      await db.from('habits').update({ archived: newArchived }).eq('id', id);
    }

    async function confirmDelete() {
      if (!deletingId) return;
      await db.from('habits').delete().eq('id', deletingId);
      habits = habits.filter(h => h.id !== deletingId);
      closeDeleteModal();
      render();
    }

    async function reorderHabits(draggedHabitId, targetHabitId) {
      const dragged = habits.find(h => h.id === draggedHabitId);
      const target  = habits.find(h => h.id === targetHabitId);
      if (!dragged || !target) return;
      if (dragged.frequency !== target.frequency || dragged.archived !== target.archived) return;

      // Reorder in local array
      const fromIdx = habits.indexOf(dragged);
      habits.splice(fromIdx, 1);
      const toIdx = habits.indexOf(target);
      habits.splice(toIdx, 0, dragged);

      render();

      // Batch-update sort_order for affected frequency group
      const group = habits.filter(h => h.frequency === dragged.frequency && h.archived === dragged.archived);
      const updates = group.map((h, i) => ({ id: h.id, sort_order: i }));

      await Promise.all(updates.map(u =>
        db.from('habits').update({ sort_order: u.sort_order }).eq('id', u.id)
      ));
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────

    function getFreqLabel(h) {
      if (h.frequency === 'weekly' && h.days) {
        const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return `Weekly: ${h.days.map(d => names[d]).join(', ')}`;
      }
      if (h.frequency === 'monthly' && h.day) {
        return `Monthly (${h.day}${ordinal(h.day)})`;
      }
      return h.frequency.charAt(0).toUpperCase() + h.frequency.slice(1);
    }

    function ordinal(n) {
      if (n % 10 === 1 && n !== 11) return 'st';
      if (n % 10 === 2 && n !== 12) return 'nd';
      if (n % 10 === 3 && n !== 13) return 'rd';
      return 'th';
    }

    function openDelete(id) {
      deletingId = id;
      const h = habits.find(h => h.id === id);
      document.getElementById('deleteMsg').textContent = `Delete "${h?.name}"? This cannot be undone.`;
      document.getElementById('deleteModal').classList.add('visible');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('visible');
      deletingId = null;
    }

    function goBack()       { window.location.href = 'habit_tracker_mockup.html'; }
    function goToProfile()  { window.location.href = 'habit_tracker_profile.html'; }
    function openAddHabit() { window.location.href = 'habit_tracker_habit_form.html?mode=add'; }
    function goToEdit(id)   { window.location.href = `habit_tracker_habit_form.html?mode=edit&id=${id}`; }

    // ─── Render ───────────────────────────────────────────────────────────────

    function renderHabit(h) {
      const archiveIcon = h.archived ? '↩' : '↻';
      return `
        <div class="habit-item" draggable="true" data-id="${h.id}">
          <span class="drag-handle">⋮⋮</span>
          <div class="habit-info">
            <div class="habit-name">${h.name}</div>
            <div class="habit-meta">
              <span class="badge freq-${h.frequency}">${getFreqLabel(h)}</span>
              <span class="badge">${h.type === 'yes/no' ? '✓/✕' : '##'}</span>
            </div>
          </div>
          <div class="habit-actions">
            <button class="action-button" onclick="goToEdit('${h.id}')" title="Edit">✎</button>
            <button class="action-button" onclick="archiveHabit('${h.id}')" title="${h.archived?'Restore':'Archive'}">${archiveIcon}</button>
            <button class="action-button delete" onclick="openDelete('${h.id}')" title="Delete">✕</button>
          </div>
        </div>`;
    }

    function renderGroup(title, list, idSuffix) {
      const countEl = `<span class="section-count">${list.length}</span>`;
      const items   = list.length
        ? list.map(h => renderHabit(h)).join('')
        : `<div class="empty-state">No ${title.toLowerCase()} habits</div>`;
      return `
        <div class="section">
          <div class="section-title">${title}${countEl}</div>
          <div id="list-${idSuffix}">${items}</div>
        </div>`;
    }

    function render() {
      const active   = habits.filter(h => !h.archived);
      const archived = habits.filter(h =>  h.archived);

      const groups = [
        { title: 'Daily',     list: active.filter(h => h.frequency === 'daily'),     id: 'daily'     },
        { title: 'Weekly',    list: active.filter(h => h.frequency === 'weekly'),    id: 'weekly'    },
        { title: 'Monthly',   list: active.filter(h => h.frequency === 'monthly'),   id: 'monthly'   },
        { title: 'Quarterly', list: active.filter(h => h.frequency === 'quarterly'), id: 'quarterly' },
        { title: 'Archived',  list: archived,                                         id: 'archived'  },
      ];

      document.getElementById('content').innerHTML =
        groups.map(g => renderGroup(g.title, g.list, g.id)).join('');

      attachDragListeners();
    }

    // ─── Drag & drop ──────────────────────────────────────────────────────────

    function attachDragListeners() {
      document.querySelectorAll('.habit-item').forEach(item => {

        // Mouse drag
        item.addEventListener('dragstart', e => {
          draggedId = e.currentTarget.dataset.id;
          e.currentTarget.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', e => {
          e.currentTarget.classList.remove('dragging');
          document.querySelectorAll('.habit-item').forEach(el => el.classList.remove('drag-over'));
          draggedId = null;
        });
        item.addEventListener('dragover', e => {
          e.preventDefault();
          if (e.currentTarget.dataset.id !== draggedId) e.currentTarget.classList.add('drag-over');
        });
        item.addEventListener('dragleave', e => e.currentTarget.classList.remove('drag-over'));
        item.addEventListener('drop', e => {
          e.preventDefault();
          e.currentTarget.classList.remove('drag-over');
          reorderHabits(draggedId, e.currentTarget.dataset.id);
        });

        // Touch drag
        item.addEventListener('touchstart', e => {
          if (e.target.closest('.habit-actions')) return;
          e.preventDefault();
          const touch = e.touches[0];
          draggedId = item.dataset.id;
          const rect = item.getBoundingClientRect();
          touchOffsetX = touch.clientX - rect.left;
          touchOffsetY = touch.clientY - rect.top;

          touchClone = item.cloneNode(true);
          touchClone.style.cssText = `
            position:fixed;left:${rect.left}px;top:${rect.top}px;
            width:${rect.width}px;opacity:0.85;pointer-events:none;
            z-index:1000;border-color:#d97757;`;
          document.body.appendChild(touchClone);
          item.classList.add('dragging');
        }, { passive: false });

        item.addEventListener('touchmove', e => {
          if (!draggedId || !touchClone) return;
          e.preventDefault();
          const touch = e.touches[0];
          touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
          touchClone.style.top  = (touch.clientY - touchOffsetY) + 'px';

          touchClone.style.display = 'none';
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          touchClone.style.display = '';
          const target = el && el.closest('.habit-item');

          document.querySelectorAll('.habit-item').forEach(el => el.classList.remove('drag-over'));
          if (target && target.dataset.id !== draggedId) target.classList.add('drag-over');
        }, { passive: false });

        item.addEventListener('touchend', e => {
          if (!draggedId) return;
          const touch = e.changedTouches[0];
          touchClone.style.display = 'none';
          const el     = document.elementFromPoint(touch.clientX, touch.clientY);
          const target = el && el.closest('.habit-item');

          touchClone.remove();
          touchClone = null;
          item.classList.remove('dragging');
          document.querySelectorAll('.habit-item').forEach(el => el.classList.remove('drag-over'));

          if (target && target.dataset.id !== draggedId) reorderHabits(draggedId, target.dataset.id);
          draggedId = null;
        });
      });
    }

    initApp();
  </script>
</body>
</html>
