<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Habit Tracker - Habit Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a; color: #f5f1ed; touch-action: manipulation;
    }
    .container { min-height: 100vh; background: #0a0a0a; padding: 12px 14px; max-width: 480px; margin: 0 auto; }
    .header { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .header button { background: none; border: none; color: #8a8985; cursor: pointer; font-size: 18px; padding: 4px; }
    .header h2 { font-size: 14px; font-weight: 400; flex: 1; margin: 0; }
    input, select {
      font-family: inherit; background: #141411; border: 1px solid #2a2925;
      color: #f5f1ed; padding: 8px 10px; border-radius: 4px; font-size: 12px;
      width: 100%; margin-top: 6px;
    }
    input:focus, select:focus { outline: none; border-color: #d97757; }
    label {
      display: block; color: #8a8985; font-size: 10px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase; margin-top: 12px; margin-bottom: 6px;
    }
    .form-section { margin-bottom: 16px; }
    .radio-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .radio-option { flex: 1; min-width: 80px; }
    .radio-option input[type="radio"] { display: none; }
    .radio-option label {
      display: block; padding: 8px 10px; background: #141411; border: 1px solid #2a2925;
      border-radius: 4px; text-align: center; cursor: pointer; transition: all 0.2s;
      margin: 0; font-size: 11px; text-transform: none; letter-spacing: 0;
    }
    .radio-option input[type="radio"]:checked + label {
      background: #d97757; border-color: #d97757; color: #0a0a0a; font-weight: 600;
    }
    .day-selector { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-top: 8px; }
    .day-button {
      padding: 8px 0; background: #141411; border: 1px solid #2a2925;
      border-radius: 4px; color: #8a8985; cursor: pointer; font-size: 11px;
      font-weight: 500; font-family: inherit; transition: all 0.2s;
    }
    .day-button.selected { background: #d97757; border-color: #d97757; color: #0a0a0a; font-weight: 600; }
    .month-selector { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 8px; }
    .month-button {
      padding: 12px; background: #141411; border: 1px solid #2a2925;
      border-radius: 4px; color: #8a8985; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: all 0.2s; text-align: center;
    }
    .month-button.selected { background: #d97757; border-color: #d97757; color: #0a0a0a; font-weight: 600; }
    .note { color: #8a8985; font-size: 10px; margin-top: 6px; }
    .button-group { display: flex; gap: 8px; margin-top: 20px; margin-bottom: 40px; }
    button.primary {
      flex: 1; padding: 10px; background: #d97757; border: none; border-radius: 4px;
      color: #0a0a0a; font-weight: 600; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: opacity 0.2s;
    }
    button.primary:hover { opacity: 0.9; }
    button.primary:disabled { opacity: 0.5; cursor: default; }
    button.secondary {
      flex: 1; padding: 10px; background: #141411; border: 1px solid #2a2925;
      border-radius: 4px; color: #8a8985; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: all 0.2s;
    }
    .conditional { display: none; }
    .conditional.visible { display: block; }
    .error-banner {
      background: rgba(217,119,87,0.1); border: 1px solid rgba(217,119,87,0.3);
      color: #d97757; padding: 8px 10px; border-radius: 4px; font-size: 11px;
      margin-bottom: 12px; display: none;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button onclick="goBack()">←</button>
      <h2 id="pageTitle">Add New Habit</h2>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <div class="form-section">
      <label for="habitName">Habit Name</label>
      <input type="text" id="habitName" placeholder="e.g., Horseback riding" />
    </div>

    <!-- FREQUENCY -->
    <div class="form-section">
      <label>Frequency</label>
      <div class="radio-group">
        <div class="radio-option"><input type="radio" id="freq-daily"     name="frequency" value="daily"     checked /><label for="freq-daily">Daily</label></div>
        <div class="radio-option"><input type="radio" id="freq-weekly"    name="frequency" value="weekly"           /><label for="freq-weekly">Weekly</label></div>
        <div class="radio-option"><input type="radio" id="freq-monthly"   name="frequency" value="monthly"          /><label for="freq-monthly">Monthly</label></div>
        <div class="radio-option"><input type="radio" id="freq-quarterly" name="frequency" value="quarterly"        /><label for="freq-quarterly">Quarterly</label></div>
      </div>
    </div>

    <!-- TYPE -->
    <div class="form-section">
      <label>Habit Type</label>
      <div class="radio-group">
        <div class="radio-option"><input type="radio" id="type-yesno"  name="type" value="yes/no" checked /><label for="type-yesno">Yes/No</label></div>
        <div class="radio-option"><input type="radio" id="type-number" name="type" value="number"         /><label for="type-number">Number</label></div>
      </div>
    </div>

    <!-- Daily section picker -->
    <div class="conditional visible" id="dailySectionField">
      <div class="form-section">
        <label>Section</label>
        <div class="radio-group">
          <div class="radio-option"><input type="radio" id="section-morning" name="section" value="morning" checked /><label for="section-morning">Morning</label></div>
          <div class="radio-option"><input type="radio" id="section-evening" name="section" value="evening"         /><label for="section-evening">Evening</label></div>
        </div>
      </div>
    </div>

    <!-- Number unit -->
    <div class="conditional" id="unitSection">
      <div class="form-section">
        <label for="unit">Unit (optional)</label>
        <input type="text" id="unit" placeholder="e.g., kg, lbs, am, min" />
        <p class="note">Shown next to the input when tracking this habit</p>
      </div>
    </div>

    <!-- Weekly days -->
    <div class="conditional" id="weeklySection">
      <div class="form-section">
        <label>Select Days</label>
        <div class="day-selector">
          <button type="button" class="day-button" data-day="0">Sun</button>
          <button type="button" class="day-button" data-day="1">Mon</button>
          <button type="button" class="day-button" data-day="2">Tue</button>
          <button type="button" class="day-button" data-day="3">Wed</button>
          <button type="button" class="day-button" data-day="4">Thu</button>
          <button type="button" class="day-button" data-day="5">Fri</button>
          <button type="button" class="day-button" data-day="6">Sat</button>
        </div>
      </div>
    </div>

    <!-- Monthly date -->
    <div class="conditional" id="monthlySection">
      <div class="form-section">
        <label for="monthlyDate">Day of Month</label>
        <input type="number" id="monthlyDate" min="1" max="31" placeholder="1–31" value="15" />
        <p class="note">Days 29–31 skip months without that day</p>
      </div>
    </div>

    <!-- Quarterly -->
    <div class="conditional" id="quarterlySection">
      <div class="form-section">
        <label>Starting Month</label>
        <div class="month-selector">
          <button type="button" class="month-button selected" data-month="0"><div style="font-weight:600;">Jan</div><div style="font-size:9px;color:#7a7570;margin-top:2px;">Q1</div></button>
          <button type="button" class="month-button" data-month="3"><div style="font-weight:600;">Apr</div><div style="font-size:9px;color:#7a7570;margin-top:2px;">Q2</div></button>
          <button type="button" class="month-button" data-month="6"><div style="font-weight:600;">Jul</div><div style="font-size:9px;color:#7a7570;margin-top:2px;">Q3</div></button>
          <button type="button" class="month-button" data-month="9"><div style="font-weight:600;">Oct</div><div style="font-size:9px;color:#7a7570;margin-top:2px;">Q4</div></button>
        </div>
        <p class="note">Habit recurs every 3 months from this month</p>
      </div>
    </div>

    <div class="button-group">
      <button class="secondary" onclick="goBack()">Cancel</button>
      <button class="primary" id="submitBtn" onclick="submitForm()">Add Habit</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params  = new URLSearchParams(window.location.search);
    const mode    = params.get('mode') || 'add';
    const habitId = params.get('id');

    let currentUser   = null;
    let selectedDays  = new Set();
    let selectedQuarter = 0;

    // ─── Init ─────────────────────────────────────────────────────────────────

    async function initApp() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'habit_tracker_login.html'; return; }
      currentUser = session.user;

      // Wire up listeners
      document.querySelectorAll('input[name="frequency"]').forEach(r =>
        r.addEventListener('change', e => updateConditionalSections(e.target.value))
      );
      document.querySelectorAll('input[name="type"]').forEach(r =>
        r.addEventListener('change', e => {
          document.getElementById('unitSection').classList.toggle('visible', e.target.value === 'number');
        })
      );
      document.querySelectorAll('.day-button').forEach(btn =>
        btn.addEventListener('click', e => {
          e.preventDefault();
          const day = parseInt(btn.dataset.day);
          if (selectedDays.has(day)) { selectedDays.delete(day); btn.classList.remove('selected'); }
          else                       { selectedDays.add(day);    btn.classList.add('selected');    }
        })
      );
      document.querySelectorAll('.month-button').forEach(btn =>
        btn.addEventListener('click', e => {
          e.preventDefault();
          document.querySelectorAll('.month-button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedQuarter = parseInt(btn.dataset.month);
        })
      );

      if (mode === 'edit' && habitId) {
        document.getElementById('pageTitle').textContent = 'Edit Habit';
        document.getElementById('submitBtn').textContent = 'Save Changes';
        await loadHabit();
      } else {
        updateConditionalSections('daily');
      }
    }

    // ─── Load habit for edit ──────────────────────────────────────────────────

    async function loadHabit() {
      const { data: h, error } = await db.from('habits').select('*').eq('id', habitId).single();
      if (error || !h) { showError('Could not load habit.'); return; }

      document.getElementById('habitName').value = h.name;

      const freqRadio = document.getElementById(`freq-${h.frequency}`);
      if (freqRadio) freqRadio.checked = true;

      const typeId = h.type === 'yes/no' ? 'yesno' : h.type;
      const typeRadio = document.getElementById(`type-${typeId}`);
      if (typeRadio) typeRadio.checked = true;

      if (h.unit) document.getElementById('unit').value = h.unit;

      if (h.days) {
        h.days.forEach(d => {
          selectedDays.add(d);
          const btn = document.querySelector(`.day-button[data-day="${d}"]`);
          if (btn) btn.classList.add('selected');
        });
      }

      if (h.day) document.getElementById('monthlyDate').value = h.day;

      if (h.section) {
        const sEl = document.getElementById(`section-${h.section}`);
        if (sEl) sEl.checked = true;
      }

      updateConditionalSections(h.frequency);
      if (h.type === 'number') document.getElementById('unitSection').classList.add('visible');
    }

    // ─── Submit ───────────────────────────────────────────────────────────────

    async function submitForm() {
      const name      = document.getElementById('habitName').value.trim();
      const frequency = document.querySelector('input[name="frequency"]:checked').value;
      const type      = document.querySelector('input[name="type"]:checked').value;

      if (!name) { showError('Please enter a habit name.'); return; }
      if (frequency === 'weekly' && selectedDays.size === 0) {
        showError('Please select at least one day.'); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const payload = {
        user_id:   currentUser.id,
        name,
        frequency,
        type,
        unit:     type === 'number' ? (document.getElementById('unit').value || null) : null,
        section:  frequency === 'daily'   ? document.querySelector('input[name="section"]:checked').value : null,
        days:     frequency === 'weekly'  ? Array.from(selectedDays).sort() : null,
        day:      frequency === 'monthly' ? parseInt(document.getElementById('monthlyDate').value) || null : null,
        archived: false,
      };

      let error;

      if (mode === 'edit') {
        ({ error } = await db.from('habits').update(payload).eq('id', habitId));
      } else {
        // Get next sort_order for this frequency group
        const { data: existing } = await db.from('habits')
          .select('sort_order')
          .eq('user_id', currentUser.id)
          .eq('frequency', frequency)
          .order('sort_order', { ascending: false })
          .limit(1);
        const nextOrder = existing && existing.length > 0 ? (existing[0].sort_order + 1) : 0;
        payload.sort_order = nextOrder;

        ({ error } = await db.from('habits').insert(payload));
      }

      if (error) {
        showError('Could not save habit. Please try again.');
        btn.disabled = false;
      } else {
        window.location.href = 'habit_tracker_manage_habits_mockup.html';
      }
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────

    function updateConditionalSections(frequency) {
      document.querySelectorAll('.conditional').forEach(el => el.classList.remove('visible'));
      const map = {
        daily:     ['dailySectionField'],
        weekly:    ['weeklySection'],
        monthly:   ['monthlySection'],
        quarterly: ['quarterlySection'],
      };
      (map[frequency] || []).forEach(id => document.getElementById(id)?.classList.add('visible'));
      // Keep unit section visible if number type is selected
      if (document.querySelector('input[name="type"]:checked')?.value === 'number') {
        document.getElementById('unitSection').classList.add('visible');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function goBack() { window.location.href = 'habit_tracker_manage_habits_mockup.html'; }

    initApp();
  </script>
</body>
</html>
